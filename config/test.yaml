settings:
  auth:
    jwt_secret: "test-signing-secret-at-least-32-bytes"
    allowed_email_domain: <%= get_env(name="AUTH_EMAIL_DOMAIN", default="midwess.com") %>
    user_token_ttl_seconds: 900
    refresh_token_ttl_seconds: 2592000

logger:
  enable: false
  pretty_backtrace: true
  level: debug
  format: compact

server:
  port: 3001
  binding: 127.0.0.1
  host: http://127.0.0.1:3001
  middlewares:
    fallback:
      enable: false

workers:
  mode: ForegroundBlocking

database:
  uri: <%= get_env(name="DATABASE_URL", default="postgres://root:shh@127.0.0.1:7887/compallm") %>
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 5
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
