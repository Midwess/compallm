[package]
name = "compallm-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Loco and Axum API with a Vite frontend and an Orval-generated client"
publish = false

[features]
default = []
frontend-dev = ["axum-frontend/dev"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
axum-frontend.workspace = true
clap.workspace = true
compallm-core = { path = "../libs/core" }
compallm-postgres = { path = "../libs/postgres" }
loco-rs = { workspace = true, features = ["cli"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = "3.2"
