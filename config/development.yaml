settings:
  auth:
    jwt_secret: "<%= get_env(name="AUTH_JWT_SECRET", default="local-development-signing-secret-change-before-production") %>"
    allowed_email_domain: <%= get_env(name="AUTH_EMAIL_DOMAIN", default="midwess.com") %>
    user_token_ttl_seconds: 900
    refresh_token_ttl_seconds: 2592000

logger:
  enable: true
  pretty_backtrace: true
  level: <%= get_env(name="LOG_LEVEL", default="debug") %>
  format: compact

server:
  port: <%= get_env(name="PORT", default="3000") %>
  binding: <%= get_env(name="BINDING", default="127.0.0.1") %>
  host: http://127.0.0.1:3000
  middlewares:
    fallback:
      enable: false

workers:
  mode: BackgroundAsync

database:
  uri: <%= get_env(name="DATABASE_URL", default="postgres://root:shh@127.0.0.1:7887/compallm") %>
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 5
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
