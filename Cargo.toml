[workspace]
members = ["libs/query", "libs/validation-derive", "api", "libs/core", "libs/postgres", "libs/utils", "libs/mailing", "test", "router", "sec"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Elastic-2.0"

[workspace.lints.clippy]
borrowed_box = "allow"

[workspace.dependencies]
compallm-query = { path = "libs/query", default-features = false }
schemars = { version = "=1.2.1", default-features = false, features = ["derive", "std"] }
compallm-validation-derive = { path = "libs/validation-derive" }
juniper = { version = "0.18.0", default-features = false, features = ["schema-language"] }
juniper_axum = { version = "0.4.0", default-features = false }
cookie = { version = "0.18", default-features = false }
tower = { version = "0.5", default-features = false }
sec = { path = "sec" }
jsonwebtoken = { version = "10", default-features = false }
validify = { version = "2", default-features = false }
futures-util = { version = "0.3", default-features = false }
compallm-core = { path = "libs/core", default-features = false }
compallm-postgres = { path = "libs/postgres", default-features = false }
compallm-utils = { path = "libs/utils", default-features = false }
compallm-mailing = { path = "libs/mailing", default-features = false }
async-channel = { version = "2.5", default-features = false }
lettre = { version = "0.11", default-features = false }
async-trait = { version = "0.1", default-features = false }
async-once-cell = { version = "0.5.4", default-features = false }
anyhow = { version = "1", default-features = false }
base64 = { version = "0.22", default-features = false }
chacha20poly1305 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
email_address = { version = "0.2", default-features = false }
rand = { version = "0.9", default-features = false }
rust_decimal = { version = "1", default-features = false }
subtle = { version = "2", default-features = false }
thiserror = { version = "2", default-features = false }
axum = { version = "0.8", default-features = false }
axum-frontend = { version = "0.1.3", default-features = false }
clap = { version = "4", default-features = false }
hero = { package = "midwess-hero", version = "1", default-features = false }
loco-rs = { version = "1.2", default-features = false }
sea-orm = { version = "2.0", default-features = false }
sea-orm-migration = { version = "2.0", default-features = false }
sea-orm-cli = { version = "2.0", default-features = false }
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }
tokio = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
serial_test = { version = "3.2", default-features = false }
heck = { version = "0.5", default-features = false }
pluralizer = { version = "0.5", default-features = false }
syn = { version = "2", default-features = false }
tempfile = { version = "3", default-features = false }
maud = { version = "0.27", default-features = false }
cedar-policy = { version = "4" }
rayon = { version = "1" }
lz4_flex = { version = "0.14", default-features = false, features = ["std", "checked-decode"] }
coset = "0.4"
ciborium = "0.2"
hmac = "0.12"
serde_bytes = "0.11"
cedar-policy-formatter = { version = "4" }
elsa = { version = "1" }
