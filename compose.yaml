services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    ports:
      - "7887:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: shh
      POSTGRES_DB: compallm
    volumes:
      - postgres-data:/var/lib/postgresql

  maildev:
    image: docker.io/maildev/maildev:latest
    ports:
      - "1080:1080"
      - "1025:1025"

volumes:
  postgres-data:
