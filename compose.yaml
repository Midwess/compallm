services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    ports:
      - "7887:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: shh
      POSTGRES_DB: compallm
      PGDATA: /var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d compallm"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
