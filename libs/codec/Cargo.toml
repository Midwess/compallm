[package]
name = "codec"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/mod.rs"

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive", "std"] }
serde_with = { version = "3.24", default-features = false, features = ["macros", "std"] }
bytes.workspace = true
futures-core.workspace = true
futures-io = { workspace = true, features = ["std"] }
thiserror.workspace = true
serde_json = { workspace = true, features = ["std", "raw_value"] }

[dev-dependencies]
futures-util = { workspace = true, features = ["std", "io"] }
serde = { workspace = true, features = ["derive"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["io", "compat"] }
