[package]
name = "compallm-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Loco and Axum API with a Vite frontend and an Orval-generated client"
publish = false

[lints]
workspace = true

[features]
default = []
frontend-dev = ["axum-frontend/dev"]

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["http1", "json", "tokio"] }
axum-frontend.workspace = true
clap = { workspace = true, features = ["std", "derive", "color", "help", "usage", "error-context", "suggestions"] }
compallm-postgres.workspace = true
compallm-core.workspace = true
hero = { workspace = true, features = ["tcp"] }
anyhow = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
loco-rs = { workspace = true, features = ["cli", "with-db", "cache_inmem", "worker"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "io-util", "time"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "ansi", "tracing-log"] }
utoipa = { workspace = true, features = ["macros"] }
utoipa-axum.workspace = true

[dev-dependencies]
tempfile.workspace = true
axum-test.workspace = true
compallm-utils.workspace = true
sea-orm = { workspace = true, features = ["mock"] }
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { workspace = true, features = ["async"] }
