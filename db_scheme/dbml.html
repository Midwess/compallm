cement | null, requiredInputs: ConfigurationInput[]}\nnone: omit configuration; no credential required.\ncustom: {adapter: string | null, parameters: {name: string}, requiredInputs: ConfigurationInput[]}\nThe type values are authentication_kind; o_auth is the current Core spelling. OAuth scopes name access rights requested from the provider. A header or query placement describes WHERE a credential is inserted, never its value.\n\nPlacement is one of {apiKeyHeader: {name: string, prefix: string}} or {apiKeyQuery: string}. A common header example is {apiKeyHeader: {name: \"Authorization\", prefix: \"Bearer \"}}. No API keys, OAuth access tokens, cookies or client secrets belong in these catalog objects.\n\nCompatibility = {\n  fieldNames?: {logicalFieldName: nativeFieldName},\n  unsupportedFields?: string[],\n  conditionalFields?: [{field: string, condition: {kind: conditional_field_rule, adapter?: string}}],\n  requiredHeaders?: {headerName: publicHeaderValue},\n  serverTools?: {logicalToolName: nativeVersionedToolName},\n  supportedOperations?: operation[],\n  supportedServiceTiers?: service_tier_kind[],\n  bedrockApis?: bedrock_api[],\n  bedrockReasoningShape?: bedrock_reasoning_shape,\n  bedrockBasePath?: bedrock_base_path\n}\nfieldNames maps logical names such as max_tokens to provider names such as max_completion_tokens. Unsupported means the server rejects that field. Conditional fields require an implemented interpretation; unknown conditions cannot be treated as accepted. Server tools are provider-hosted tools with versioned names, such as a web-search tool. Bedrock is the AWS model-hosting service; its native APIs and opaque reasoning formats are distinct wire contracts.\nConfigurationInput = {name: string, kind: configuration_input_kind, required: boolean, allowedValues: string[] | null}. It describes a value the user must supply, such as region or deployment name; it is not the supplied secret itself.\n''']\n  headers jsonb [not null, default: `'{}'::jsonb`, note: '''\nAn object mapping HTTP header names to non-secret string values, matching the current Core Headers map:\n{\"Anthropic-Version\": \"2023-06-01\"}\nHeaders are request metadata sent outside the JSON body. An empty object means no extra defaults. Names are unique ignoring letter case; values must be valid header values. Authorization secrets are stored on the saved provider, never here. A later override uses the same case-insensitive name matching.\n''']\n  authentication_options jsonb [not null, default: `'[]'::jsonb`, note: '''\nList of the Authentication objects documented on connection. Allows a provider to offer API-key and OAuth access without selecting a secret. Example: [{\"type\":\"none\"}]. An empty list means no additional methods are recorded, not proof that authentication is unnecessary. Never includes credential values.\n''']\n  source_id uint64 [note: '''\nOptional FK to the human-review evidence bundle in catalog_sources. Null means no linked evidence bundle. Normal configuration queries do not load that document.\n\nA foreign key (FK) references the identifier of another database row.\n''']\n\n  indexes {\n    (organization_id, user_id)\n    based_on_id\n  }\n  Note: '''Reusable public/private provider definition. Saved providers own encrypted credentials separately. Account-specific endpoint settings use a private definition. Missing upstream facts remain optional until configured.\n\nDatabase CHECK requirements for implementation:\nprovider_owner_shape: user_id IS NULL OR organization_id IS NOT NULL\nprovider_not_own_origin: based_on_id IS NULL OR based_on_id \u003c> id\nprovider_connection_object: jsonb_typeof(connection) = \"object\"\nprovider_headers_object: jsonb_typeof(headers) = \"object\"; header names are case-insensitively unique\n'''\n}\n\nTable catalog_models [headercolor: #426B9A] {\n  id uint64 [pk, not null, note: 'Stable primary key (the unique row identifier) of this model configuration definition. Distinct from the provider request identifier and from a saved model resource ID.']\n  provider_id uint64 [not null, note: 'Foreign key (reference to another table row) pointing to catalog_providers identifying the provider definition for this model. The same underlying model can have separate definitions for different providers.']\n  organization_id uint64 [note: 'Organization owning a private model definition. Null with user_id null means public. Personal copies also set user_id; visibility and references must respect this ownership.']\n  user_id uint64 [note: 'Owner of a personal model definition within organization_id. Null means the definition is public or organization-private, depending on organization_id.']\n  based_on_id uint64 [note: '''\nOrigin of a complete private clone; not a model-name fallback rule.\n\nFallback means consulting the explicitly referenced book for missing values under compatible conditions; it does not switch the serving model.\n''']\n  upstream_model_id text [not null, note: 'Exact provider request identifier, distinct from database identity and display name.']\n  display_name text [note: 'Optional friendly label shown in the UI. Null allows display of upstream_model_id. Does not change the identifier sent to the provider.']\n  description text [note: 'Optional human-readable model description. Null means no description has been recorded; it does not block known configuration.']\n  service_kind service_kind [note: '''\nWhat kind of service this model provides. Allowed values are listed in the service_kind enum. llm means language generation; tts means text to speech; stt means speech to text; ocr means reading text from scans; rerank means reordering search candidates. Null means not yet classified. This broad category is separate from operation: one language service may support both chat and responses. Additional catalog categories do not establish executable adapter support.\n''']\n  connections jsonb [not null, default: `'{}'::jsonb`, note: '''\nObject keyed by protocol enum values, each containing the Connection contract documented on catalog_providers.connection. Example:\n{\"openai\": {\"baseUrl\": \"https://api.example.com/v1\", \"path\": \"/chat/completions\", \"timeoutMs\": 30000, \"query\": {}, \"authentication\": null, \"endpoint\": {\"mode\": \"fixed\", \"urlTemplate\": null, \"requiredInputs\": []}}}\nProtocol means the request/response wire format, not the provider brand. Allowed keys are exactly the protocol enum. An empty object means no recorded supported wire configuration, not a usable connection. Unknown native protocols require provider_native with an explicit adapter name; do not relabel them OpenAI-compatible without evidence.\n\n\nConnection is a typed configuration object, not a URL string:\n{\n  baseUrl: string | null,\n  path: string | null,\n  timeoutMs: positiveInteger | null,\n  query: {queryParameterName: string},\n  authentication: Authentication | null,\n  endpoint: {\n    mode: endpoint_mode,\n    urlTemplate: string | null,\n    requiredInputs: ConfigurationInput[]\n  },\n  adapter: {name: string, parameters: object} | null,\n  compatibility: Compatibility | null\n}\nbaseUrl is the upstream server address. path is appended to it. timeoutMs is the maximum wait in milliseconds, where 1000 ms = 1 second. query holds non-secret URL parameters. urlTemplate uses named account inputs when a common URL is insufficient. adapter identifies provider-specific request handling; storing it does not implement it.\n\nAuthentication uses the existing Rust tagged shape {type, configuration}:\napi_key: {placement: Placement | null, requiredInputs: ConfigurationInput[]}\no_auth: {flow: oauth_flow | null, authorizationUrl: string | null, tokenUrl: string | null, deviceAuthorizationUrl: string | null, scopes: string[], tokenPlacement: Placement | null, requiredInputs: ConfigurationInput[]}\nnone: omit configuration; no credential required.\ncustom: {adapter: string | null, parameters: {name: string}, requiredInputs: ConfigurationInput[]}\nThe type values are authentication_kind; o_auth is the current Core spelling. OAuth scopes name access rights requested from the provider. A header or query placement describes WHERE a credential is inserted, never its value.\n\nPlacement is one of {apiKeyHeader: {name: string, prefix: string}} or {apiKeyQuery: string}. A common header example is {apiKeyHeader: {name: \"Authorization\", prefix: \"Bearer \"}}. No API keys, OAuth access tokens, cookies or client secrets belong in these catalog objects.\n\nCompatibility = {\n  fieldNames?: {logicalFieldName: nativeFieldName},\n  unsupportedFields?: string[],\n  conditionalFields?: [{field: string, condition: {kind: conditional_field_rule, adapter?: string}}],\n  requiredHeaders?: {headerName: publicHeaderValue},\n  serverTools?: {logicalToolName: nativeVersionedToolName},\n  supportedOperations?: operation[],\n  supportedServiceTiers?: service_tier_kind[],\n  bedrockApis?: bedrock_api[],\n  bedrockReasoningShape?: bedrock_reasoning_shape,\n  bedrockBasePath?: bedrock_base_path\n}\nfieldNames maps logical names such as max_tokens to provider names such as max_completion_tokens. Unsupported means the server rejects that field. Conditional fields require an implemented interpretation; unknown conditions cannot be treated as accepted. Server tools are provider-hosted tools with versioned names, such as a web-search tool. Bedrock is the AWS model-hosting service; its native APIs and opaque reasoning formats are distinct wire contracts.\nConfigurationInput = {name: string, kind: configuration_input_kind, required: boolean, allowedValues: string[] | null}. It describes a value the user must supply, such as region or deployment name; it is not the supplied secret itself.\n''']\n  headers jsonb [not null, default: `'{}'::jsonb`, note: '''\nAn object mapping HTTP header names to non-secret string values, matching the current Core Headers map:\n{\"Anthropic-Version\": \"2023-06-01\"}\nHeaders are request metadata sent outside the JSON body. An empty object means no extra defaults. Names are unique ignoring letter case; values must be valid header values. Authorization secrets are stored on the saved provider, never here. A later override uses the same case-insensitive name matching.\n\nModel-level defaults combine with provider headers under the shared request rules.\n''']\n  body_defaults jsonb [not null, default: `'{}'::jsonb`, note: '''\nJSON object of default request-body fields. The body is the content sent to the model, separate from HTTP headers. Example: {\"temperature\": 0.7, \"top_p\": 0.9}.\ntemperature usually adjusts randomness; top_p is nucleus sampling, selecting from a probability mass; provider support and ranges vary. Keys must be accepted by the selected operation/protocol and values keep their native JSON type. Host-selection preferences, such as OpenRouter provider.order/only/allow_fallbacks, also live here using the provider accepted host labels. The provider adapter validates supported body fields; no local host-map table is required. For example {\"provider\":{\"order\":[\"DeepSeek\"],\"allow_fallbacks\":false}} prefers that host without switching after failure; an exact restriction must follow the provider documented only/allowlist behavior. Booleans/numbers are not stringified. This is a typed request-default map validated against capability parameter descriptors, not an arbitrary provider response. Empty object means no extra body defaults. Provider-specific custom headers remain in the existing headers map. Host-dependent prices and limits remain conditional/unknown unless the exact selected host tariff is verified; a body preference does not prove one guaranteed hosting price. Capability limit and pricing columns remain the authorities for those settings.\n''']\n\n  price_book_id uint64 [note: '''\nDirect pricing FK. Multiple models may reference the same book. Null means no assigned pricing.\n\nA foreign key (FK) references the identifier of another database row.\n''']\n  source_id uint64 [note: '''\nOptional FK to model research evidence in catalog_sources, including field confidence and unresolved findings in its details document. Normal model reads do not deserialize it.\n\nA foreign key (FK) references the identifier of another database row.\n''']\n\n  indexes {\n    (provider_id, upstream_model_id)\n    (organization_id, user_id, based_on_id)\n    price_book_id\n  }\n  Note: '''\nComplete provider-specific model configuration. The same underlying model may have different features, limits and prices through different providers. Token limits belong to the text capability; money belongs to pricing books.\n\nImplement partial unique indexes for public (provider_id, upstream_model_id) identity and one private customization per original model and ownership scope. Custom private models without an origin use scope-aware upstream identity. Private copies retain their exact request identity without colliding with public originals.\n\nCapability membership stores supported features only. A missing row means no recorded support; it does not establish confirmed lack of support. Explicit negative observations and uncertainty remain in catalog_sources. A private copy owns its capability set, including an explicitly empty set.\n\n\nDatabase CHECK requirements for implementation:\nmodel_owner_shape: user_id IS NULL OR organization_id IS NOT NULL\nmodel_not_own_origin: based_on_id IS NULL OR based_on_id \u003c> id\nmodel_connections_object: jsonb_typeof(connections) = \"object\"; every key is a protocol enum and every value satisfies Connection\nmodel_headers_object: jsonb_typeof(headers) = \"object\"\nmodel_body_object: jsonb_typeof(body_defaults) = \"object\"\n'''\n}\n\n\nTable model_capabilities [headercolor: #5B8F7A] {\n  model_id uint64 [not null, note: 'Foreign key (reference to another table row) pointing to the public or private catalog_models definition owning this capability. Combined with capability, uniquely identifies the row. Deleting an unreferenced definition deletes its capability rows.']\n  capability capability [not null, note: 'Supported feature represented by this row, such as text, vision, reasoning or embedding. The enum selects applicable limit columns and typed configuration. Only supported features have rows. A missing row means no recorded support; explicit negative observations remain research evidence.']\n  context_window bigint [note: '''\nText only: total input-plus-output token capacity. Known actual input plus actual output must fit this window. Null means unknown on an imported definition or no configured gateway cap on a private definition; upstream restrictions still apply.\n\nUpstream means the external provider service that actually runs the model.\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  max_input_tokens bigint [note: '''\nText only: independent input-token ceiling. May equal the entire context window even when an output ceiling exists. Null means no recorded/configured ceiling, never zero. A known value must fit a known context_window.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  max_output_tokens bigint [note: '''\nText only: independent generated-output token ceiling. This is neither the default nor the minimum. Null means no recorded/configured ceiling; the provider can still enforce one. Known values must fit a known context_window.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  min_output_tokens bigint [note: '''\nText only: minimum accepted value of the requested output-token cap. Null means unknown. Explicit zero means no provider floor. This is not a minimum actual response length.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  default_output_tokens bigint [note: '''\nText only: output-token cap used when a request omits it, if known or configured. Null leaves default selection to the request/provider rules. A known default must satisfy known output floor, ceiling and context bounds.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  min_budget_tokens bigint [note: '''\nReasoning only: minimum accepted explicit thinking-token budget. Null means unknown; zero can be a valid published bound. Whether zero disables thinking is controlled by supportsDisable, not inferred from this value.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  max_budget_tokens bigint [note: '''\nReasoning only: maximum accepted explicit thinking-token budget. Null means unknown. Must not be below a known minimum; interaction with output tokens follows the provider-specific reasoning contract.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  default_budget_tokens bigint [note: '''\nReasoning only: explicit thinking-token budget used by default, when known or configured. Null means no explicit default. A known value fits known minimum/maximum bounds. Automatic mode is represented separately.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  max_images integer [note: 'Vision or image_generation: maximum image count for the applicable operation. Positive when known. Null means no recorded/configured count cap. Operation-specific restrictions must not become universal model claims.']\n  max_files integer [note: 'PDF capability: maximum document/file count for the applicable operation. Positive when known; null means no recorded/configured count cap.']\n  max_pages integer [note: 'PDF capability: maximum page count within the documented file or request scope. Positive when known; null means no recorded/configured page cap. Preserve the exact scope in configuration/evidence.']\n  max_bytes bigint [note: '''\nMedia capability: maximum bytes per item for vision, PDF, audio, audio_generation or video. Positive when known; null means no recorded/configured byte cap. Counts bytes, not tokens or base64 characters.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  max_total_bytes bigint [note: 'Media capability: maximum aggregate bytes across items in one applicable operation. Independent of max_bytes per item. Positive when known; null means no recorded/configured aggregate cap.']\n  max_duration_ms bigint [note: 'Audio, audio_generation or video: maximum duration in milliseconds within the documented operation scope. Positive when known; null means no recorded/configured duration cap.']\n  max_frames integer [note: 'Video capability: maximum accepted frame count for the applicable operation. Positive when known; null means no recorded/configured frame cap. Does not imply a frame rate.']\n  max_tools integer [note: 'Tool calling: maximum declared tools accepted for the applicable operation. Positive when known; null means no recorded/configured tool-count cap. Not a maximum number of executed tool calls.']\n  max_name_length integer [note: '''\nTool calling: maximum tool-name length accepted on the wire. Positive when known; null means unknown. Preserve whether the provider measures characters or bytes; do not substitute one unit for the other.\n\nWire format means the exact field names and data encoding sent to the provider.\n''']\n  max_results integer [note: 'Search capability: maximum returned result count for the applicable operation. Positive when known; null means no recorded/configured result-count cap.']\n  default_dimensions integer [note: 'Embedding capability: default vector length, measured in dimensions. Positive when known. Null means no recorded default; this is not an inferred maximum. Must belong to supported_dimensions when both are specified.']\n  supported_dimensions integer[] [note: 'Embedding capability: explicitly accepted vector lengths. Null means the accepted set is unknown. A present array is nonempty, positive and duplicate-free. A single published default does not establish this set.']\n  min_prefix_tokens bigint [note: '''\nPrompt caching: minimum cacheable prefix length in tokens for this provider/model. Null means unknown. Explicit zero means no minimum threshold. A runtime fallback must not be presented as a published model fact.\n\nFallback means consulting the explicitly referenced book for missing values under compatible conditions; it does not switch the serving model.\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  max_breakpoints integer [note: 'Prompt caching: maximum explicitly configured cache breakpoints for the applicable operation. Positive when known; null means unknown. An absent value does not establish implicit or explicit caching support.']\n  configuration jsonb [not null, default: `'{}'::jsonb`, note: '''\nCapability-specific settings that are not already columns. The capability enum selects one shape. Optional keys mean unknown/unconfigured; false is an explicit negative. Prices and numeric capability-limit columns are never repeated here.\n\ntext = {input?: boolean, output?: boolean, outputCapRequired?: boolean, supportsSystemMessages?: boolean, supportsDeveloperRole?: boolean, supportsAssistantPrefill?: boolean, supportsSampling?: boolean, supportedParameters?: ParameterDescriptor[]}\nvision = {formats?: string[]}\npdf = {formats?: string[]}\naudio / audio_generation = {formats?: string[]}\nvideo = {formats?: string[]}\nimage_generation = {formats?: string[], supportedSizes?: [{width: integer, height: integer}], supportedQualities?: Quality[]}\nreasoning = {supportedEfforts?: ReasoningLevel[], effortMapping?: [{level: ReasoningLevel, nativeValue: string}], defaultEffort?: ReasoningLevel, supportsBudget?: boolean, supportsDisable?: boolean, supportsAutomaticBudget?: boolean, alwaysEnabled?: boolean, supportedContexts?: reasoning_context[], supportsAdaptive?: boolean, supportsInterleaved?: boolean, supportsWithTools?: boolean, supportsRedaction?: boolean, supportsBetweenTools?: boolean, supportsDisplayUpdates?: boolean}\ntool_call = {reservedNamespaces?: string[], parallelCalls?: boolean, supportsNamespaces?: boolean, supportsAsync?: boolean, supportsCustomTools?: boolean, supportsMultimodalOutput?: boolean}\nforced_tool_choice = {acceptedChoices?: string[]}\nstructured_output = {jsonMode?: boolean, jsonSchema?: boolean, native?: boolean, supportsWithTools?: boolean, supportsRegexLookaround?: boolean}\nsearch = {dynamicQueries?: boolean, webFetch?: boolean}\nembedding = {encodingFormats?: string[]}\nprompt_caching = {supportsExplicit?: boolean, supportsImplicit?: boolean, supportedTtlSeconds?: integer[], supportsScope?: boolean}\n\nReasoningLevel = {kind: reasoning_effort, nativeValue?: string} | {kind: \"custom\", nativeValue: string}. The known levels are none, minimal, low, medium, high, xhigh, max; custom retains an exact provider level without guessing an equivalent. Effort is a named amount of thinking, not a token count. Adaptive means the model decides how much to think; interleaved means thinking can occur between tool calls; redaction means hidden/removed reasoning content.\nQuality = {kind: quality_kind, nativeValue?: string}; nativeValue preserves an exact provider quality name when kind=custom.\nParameterDescriptor = {name: string, kind: parameter_kind, minimum?: number, maximum?: number, default?: JSONValue, allowedValues?: JSONValue[], help?: string}. A parameter is a named request input, such as temperature; parameter_kind lists allowed JSON types. Its default must satisfy its known bounds and choices. Listing a parameter does not establish an unknown numeric range. JSONValue is a valid JSON scalar, array or object, not encoded JSON text.\n\nformats contains provider MIME/file-format identifiers, such as image/png or wav. JSON mode requests JSON text; JSON Schema specifies allowed object structure. Native means the provider enforces it directly; an emulated schema via tools is different. Regex lookaround is a regular-expression feature not accepted by all schema engines. A reserved tool namespace is a name prefix owned by the provider. Async tools may finish later rather than during the immediate response. Caching is reuse of prompt processing; implicit means automatic reuse, explicit means request-controlled. TTL is retention duration in seconds.\n\nEvery capability may also have operationOverrides: [{operation: operation, endpoint?: string, limits?: CapabilityLimitPatch, configuration?: CapabilitySettings}]. CapabilityLimitPatch has exactly the applicable numeric/array limit column names and types from this row; only present keys override, and explicit null clears a configured gateway cap. CapabilitySettings is the chosen shape above without nested operationOverrides. This preserves adapter-specific limits without claiming they apply to all operations.\n\nNumeric reasoning budgets, embedding dimensions, image counts, media sizes, tool counts and cache thresholds are visible columns. Provider sentinels such as -1 for automatic reasoning are represented by support flags and translated by an adapter, not stored as negative ordinary limits. Cross-capability dependencies remain enforced by domain/database validation. An unknown or unsupported provider feature stays research evidence until a typed implementation is available.\n''']\n\n  indexes {\n    (model_id, capability) [pk]\n    (capability, model_id)\n  }\n  Note: '''\nOnly supported capabilities have rows. Rust maintains the full capability list. Absence means no recorded support, not proof of lack of support. No model-wide completeness flag is stored.\n\nInput/output ceilings are independent: their sum may exceed context_window. Actual input plus actual output must fit the context at request time. Clearing a configured gateway cap sets its column to null; it cannot remove the upstream provider constraint. Keep the original public definition/evidence intact so a private policy cap cannot be mistaken for a newly published provider maximum. UI bounds come from Rust; published observations retain source precision and are not clamped to a slider.\n\n\nDatabase CHECK requirements for implementation:\ntoken_limits_require_text: capability = \"text\" OR (context_window IS NULL AND max_input_tokens IS NULL AND max_output_tokens IS NULL AND min_output_tokens IS NULL AND default_output_tokens IS NULL)\npositive_context_window: context_window IS NULL OR context_window > 0\npositive_input_limit: max_input_tokens IS NULL OR max_input_tokens > 0\npositive_output_limit: max_output_tokens IS NULL OR max_output_tokens > 0\ninput_within_context: context_window IS NULL OR max_input_tokens IS NULL OR max_input_tokens \u003c= context_window\noutput_within_context: context_window IS NULL OR max_output_tokens IS NULL OR max_output_tokens \u003c= context_window\nnonnegative_output_floor: min_output_tokens IS NULL OR min_output_tokens >= 0\npositive_default_output: default_output_tokens IS NULL OR default_output_tokens > 0\noutput_floor_within_ceiling: min_output_tokens IS NULL OR max_output_tokens IS NULL OR min_output_tokens \u003c= max_output_tokens\ndefault_above_output_floor: default_output_tokens IS NULL OR min_output_tokens IS NULL OR default_output_tokens >= min_output_tokens\ndefault_within_output_ceiling: default_output_tokens IS NULL OR max_output_tokens IS NULL OR default_output_tokens \u003c= max_output_tokens\ndefault_within_context: default_output_tokens IS NULL OR context_window IS NULL OR default_output_tokens \u003c= context_window\ncapability_configuration_object: jsonb_typeof(configuration) = \"object\"\n\nAdditional column constraints for implementation:\nreasoning_budget_scope: min_budget_tokens, max_budget_tokens and default_budget_tokens are null unless capability is reasoning. Known values are nonnegative; minimum \u003c= default \u003c= maximum wherever both sides are known. Provider disable/automatic sentinels remain separate flags, not negative budget bounds.\nimage_count_scope: max_images is null unless capability is vision or image_generation.\ndocument_scope: max_files and max_pages are null unless capability is pdf.\nbyte_limit_scope: max_bytes and max_total_bytes are null unless capability is vision, pdf, audio, audio_generation or video.\nduration_scope: max_duration_ms is null unless capability is audio, audio_generation or video.\nframe_scope: max_frames is null unless capability is video.\ntool_scope: max_tools and max_name_length are null unless capability is tool_call.\nsearch_scope: max_results is null unless capability is search.\nembedding_scope: default_dimensions and supported_dimensions are null unless capability is embedding. Known dimensions are positive. Explicit dimension sets are nonempty, unique and include default_dimensions when both are set.\ncache_scope: min_prefix_tokens and max_breakpoints are null unless capability is prompt_caching. Known prefix thresholds are nonnegative. A known breakpoint count is positive.\npositive_optional_limits: all other known count, byte, duration and dimension columns are positive. No absent limit becomes zero. Per-item limits and aggregate limits are independent; a larger per-item ceiling does not require the same aggregate ceiling.\n'''\n}\n\nTable price_books [headercolor: #A27A40] {\n  id uint64 [pk, not null, note: 'Primary key identifying one reusable tariff book. Referenced by catalog_models.price_book_id and by private books through fallback_book_id. Multiple models may share it.']\n  name text [not null, note: 'Human-readable tariff label, such as a provider/model public tariff or a private negotiated tariff. Matching uses explicit references, not this label.']\n  organization_id uint64 [note: '''\nOrganization owning this private tariff. Null with user_id null means public. Ownership also governs its price_rates rows and allowed fallback references.\n\nFallback means consulting the explicitly referenced book for missing values under compatible conditions; it does not switch the serving model.\n''']\n  user_id uint64 [note: 'Owner of a personal pricing book inside organization_id. Null means public or organization-private according to organization_id. A personal book cannot be used by an unrelated user.']\n  fallback_book_id uint64 [note: '''\nOptional FK to the book supplying compatible missing usage prices. Null ends the fallback chain. Private custom rates win, including zero. Reject cycles and unauthorized or incompatible references.\n\nA foreign key (FK) references the identifier of another database row.\nFallback means consulting the explicitly referenced book for missing values under compatible conditions; it does not switch the serving model.\n''']\n  billing_kind billing_kind [not null, default: 'unknown', note: '''\nBilling category: metered usage, subscription, explicitly free, or unknown. Unknown may resolve through a compatible fallback book. Missing rates alone never establish free billing.\n\nFallback means consulting the explicitly referenced book for missing values under compatible conditions; it does not switch the serving model.\n''']\n\n  source_id uint64 [note: '''\nOptional FK to evidence supporting the tariff classification and billing terms. Rate-specific evidence can additionally be attached to individual price_rates rows.\n\nA foreign key (FK) references the identifier of another database row.\n''']\n\n  indexes {\n    fallback_book_id\n    (organization_id, user_id)\n  }\n  Note: '''\nA tariff can serve multiple model definitions. Ownership covers all its rate rows. Public books cannot depend on private books.\n\nCustomization: create private B, set B.fallback_book_id = public A, insert only changed rates, then point the private model to B. Reset points back to A. Delete B only when unreferenced.\n\nReject indirect cycles through cross-row validation; the self-reference CHECK alone is insufficient. Unknown billing_kind can inherit the fallback category. An explicitly free tariff must never inherit paid usage rates. Subscription account fees are separate from usage-rate inheritance; neither a missing model rate nor a subscription classification establishes a zero monetary cost.\n\n\nDatabase CHECK requirements for implementation:\nbook_owner_shape: user_id IS NULL OR organization_id IS NOT NULL\nbook_not_own_fallback: fallback_book_id IS NULL OR fallback_book_id \u003c> id\n'''\n}\n\nTable price_rates [headercolor: #A27A40] {\n  id uint64 [pk, not null, note: '''\nUnique internal primary key of one price rule or private rate patch. All internal IDs use the same full-range unsigned 64-bit domain.\n''']\n  price_book_id uint64 [not null, note: '''\nForeign key to price_books. One reusable book owns many rate rows, each identifying a capability, usage unit and applicable conditions. Several models can point to the same book. A private book inherits only compatible missing rates through its explicit fallback_book_id.\n''']\n  capability capability [not null, note: '''\nCapability whose usage this rate prices, such as text, image_generation, audio or prompt_caching. This one enum replaces the separate capability rate tables. It chooses applicable numeric amount columns; unrelated fields remain null. A price row does not establish that the model supports this capability.\n''']\n  operation operation [not null, note: '''\nProvider action using the capability, such as chat, responses, embedding, image_edit or transcription. Explicit on each row rather than defaulting every capability to chat. Streaming emits results incrementally; batch processing is a separate pricing condition. An operation name does not establish an implemented adapter.\n''']\n  modality usage_modality [not null, note: '''\nKind of content counted by this price: text, image, audio, video, document or separately reported reasoning. This can differ from capability: image_generation may have one text-input-token row and another image-output row. Distinguish usage components to avoid billing the same tokens twice.\n''']\n  charge_kind capability_charge_kind [not null, default: 'usage', note: 'usage means numeric measured-usage rates; free requires explicit evidence; included avoids a second charge already covered elsewhere; model_billing delegates to configured account billing, not zero cost.']\n  currency currency_code [note: 'Closed currency_code enum using named ISO 4217 monetary codes, such as USD (US Dollar) and CNY (Yuan Renminbi). Required for monetary usage rates; native credit rows leave it null. Only use a code actually established by the provider tariff. Do not label credits as dollars or convert currencies implicitly.']\n  denomination denomination_kind [not null, default: 'fiat', note: 'fiat means rate amounts use currency. credits means they use credit_unit. No monetary conversion is inferred; an unsupported conversion rule remains in source evidence until explicit storage and calculation are defined. This distinguishes a real monetary price from provider-defined credits.']\n  credit_unit pricing_credit_unit [note: '''\nProvider-native billing denomination, selected from the explicit pricing_credit_unit enum. Null is required for fiat prices such as USD. A credit unit is not a token count or a currency: numeric price columns on a credits row are denominated in the chosen provider unit.\n\nKnown values from the inspected source data: databricks_dbu identifies Databricks Units recorded in input/output_dbu_cost_per_token. reducto_credit identifies Reducto credits referenced by ocr_cost_per_credit. The latter is a monetary conversion per credit; it does not establish credits per document/page and must not be imported as such.\n\nThe enum names the exact provider-specific unit; providers credits are not interchangeable. Keep monetary conversion rules in source evidence until explicit typed conversion storage/calculation exists. An unknown newly researched denomination requires an enum update before it is executable pricing; no generic custom-string unit is accepted.\n''']\n  region_code pricing_region [note: '''\nProvider region/geography qualifier selecting this price. Region can change the tariff, processing location or account availability, but a pricing label alone is not a data-residency guarantee.\n\nAllowed values are listed in pricing_region and were taken from the inspected LiteLLM provider/region/model price-map identities. For example us-east-1 is an AWS region; eu is an Azure geography scope. Preserve exact provider meaning: a shared spelling does not establish equal prices across providers. global-standard is retained as an exact Azure pricing qualifier, not interpreted as a physical region.\n\nNull means no explicit region qualifier on this recorded tariff, not proof that it applies to all locations. A new observed code requires an explicit enum update before it becomes executable catalog pricing; until then retain the source record as unresolved. No custom/free-text escape hatch is stored here.\n''']\n  service_tier service_tier_kind [not null, default: 'standard', note: 'Provider processing class used to choose prices: standard, priority, flex, balanced, ultrafast, provisioned or fast. Not a capability, hosting company, subscription plan or batch flag. Price the actually served tier reported by the provider; auto is a request preference and cannot be a tariff row.']\n  speed_mode provider_speed_mode [note: 'Optional separate provider speed setting. Anthropic speed=fast uses its own rate fields; OpenAI service_tier=fast is not the same control. Null means no explicit speed condition.']\n  batch boolean [not null, default: false, note: 'true selects a background multi-request job tariff. false selects ordinary calls. Batch collects results later and is not simply several concurrent normal calls. This selects a price; it does not establish batch support.']\n  context_min_tokens bigint [note: '''\nInclusive lower request-size boundary selecting this price. Null means no lower condition. Measured tokens follow tier_basis. This is a pricing bracket, not a model context-window limit.\n''']\n  context_max_tokens bigint [note: '''\nExclusive upper request-size boundary selecting this price. Null means unbounded. Convert source-native boundaries exactly. Does not restrict what the model is capable of accepting.\n''']\n  tier_basis tier_basis [note: 'Whether input or total input-plus-output tokens select the context-price bracket. Only populate from an established source rule; it is not interchangeable with service_tier.']\n  quality quality_kind [note: '''\nOptional quality selecting an image/video generation price, such as high or standard. Known quality categories use this enum. A custom provider label without an explicit scalar representation remains unresolved source evidence; do not guess a known category. Unrelated capabilities leave this null. This is not the model supported-quality list.\n''']\n  width_pixels integer [note: '''\nOptional exact media width selecting an image/video price. Positive when present; unrelated rows leave it null. Model size limits belong to model_capabilities.\n''']\n  height_pixels integer [note: '''\nOptional exact media height selecting an image/video price. Positive when present; unrelated rows leave it null. Model size limits belong to model_capabilities.\n''']\n  resolution text [note: '''\nOptional exact provider image/video resolution label, such as 720p or 1080p. An external label, not a global enum or model maximum. Preserve the source spelling and leave null when no named-resolution condition applies.\n''']\n  search_context_size search_context_size [note: 'Optional amount of retrieved context selecting a search tariff: low, medium or high. It is provider-defined and not the model token window.']\n  cache_ttl_seconds integer [note: 'Cache time to live: retention duration in seconds selecting a cache-write price. Null means no TTL-specific selector, not proof of unlimited retention.']\n  cache_read_kind cache_charge_kind [note: 'Optional explicit rule for cache reads: separate_rate, estimated_rate, standard_input_rate, included or unsupported. A null numeric price alone does not establish any of these.']\n  cache_write_kind cache_charge_kind [note: 'Optional explicit rule for cache creation. Cached tokens can require a different price or be charged at ordinary input rates; preserve the provider rule.']\n  starts_at_utc time [note: 'Inclusive start of a published daily price window in UTC, a common reference timezone. Null with ends_at_utc means all day. Split a window crossing midnight.']\n  ends_at_utc time [note: 'Exclusive end of the daily UTC window. 24:00:00 is the end of the day. Both daily bounds must be set together and ordered.']\n  input_per_million_tokens numeric [note: 'Amount per 1,000,000 input tokens. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  output_per_million_tokens numeric [note: 'Amount per 1,000,000 generated output tokens. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  input_per_million_characters numeric [note: 'Amount per 1,000,000 input characters. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  output_per_million_characters numeric [note: 'Amount per 1,000,000 output characters. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  input_per_million_bytes numeric [note: 'Amount per 1,000,000 input UTF-8 bytes. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  per_request numeric [note: 'Amount per one provider API request. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  input_per_image numeric [note: 'Amount per one accepted input image. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  input_per_pixel numeric [note: 'Amount per one billable input pixel. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  per_page numeric [note: 'Amount per one billable document page. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  input_per_second numeric [note: 'Amount per one second of input media/service duration. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  output_per_second numeric [note: 'Amount per one second of generated media/service duration. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  output_per_video numeric [note: 'Amount per one complete generated video. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  output_per_image numeric [note: 'Amount per one generated output image. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  output_per_pixel numeric [note: 'Amount per one billable output pixel. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  per_query numeric [note: 'Amount per one provider-defined query. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  per_session numeric [note: 'Amount per one provider-defined tool/service session. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  cache_read_per_million_tokens numeric [note: 'Amount per 1,000,000 cached input tokens read. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n  cache_write_per_million_tokens numeric [note: 'Amount per 1,000,000 input tokens written to cache. Fiat uses currency; native credits use credit_unit. Null is unspecified and may inherit only under compatible book conditions; zero is explicit. Use the unit in the column name and charge each documented usage component once.']\n\n  source_id uint64 [note: 'Optional foreign key to catalog_sources evidence for this exact capability tariff and selector combination. Research keeps original units, exact quotes and estimates separate from verified facts.']\n\n  indexes {\n    (price_book_id, capability, operation, modality)\n    (price_book_id, region_code, service_tier, batch)\n  }\n  Note: '''\nOne shared rate table. A model references price_books; each book owns many price_rates. capability identifies the priced feature, modality identifies the content being counted, and operation identifies the provider action. Numeric column names specify their billing units, avoiding another unit selector. Nullable fields retain only relevant prices and source-backed selectors.\n\nExamples: text input/output uses the per-million-token columns. Image understanding can use input_per_image or input_per_pixel. Image generation can price text input tokens separately from output images. Audio transcription can use input_per_second. An embedding service normally has input-only prices. Cache rows use read/write token amounts plus their documented modality and retention. Select the applicable published unit for each usage component; do not charge token/image or duration/request alternatives twice. Explicit additive charges, such as a flat request fee plus token charges, remain separate documented components.\n\nNull is unspecified, not zero. Private books can fill missing compatible amounts through their explicit fallback_book_id. Zero is explicit. All stored amounts are finite and nonnegative. Free/included/model_billing rows do not fabricate extra numeric usage fees; monthly subscription-account charges remain in provider_subscription_accounts and are counted once per account and monthly period.\n\nRequired implementation constraints:\n- Applicable numeric column groups follow capability, modality and operation. Unrelated fields stay null. Distinct nonadditive billing-unit groups cannot be populated as competing formulas for the same usage component. At least one applicable amount is required for an ordinary usage row.\n- Monetary usage requires a currency_code enum value and no credit_unit. Native-credit usage requires credit_unit; no implicit monetary conversion is performed. Unrepresented conversion instructions remain source evidence.\n- service_tier cannot be auto: that is a request preference, not a served tariff. Unrecognized provider tier names remain source evidence until an explicit service_tier_kind value and adapter mapping are added. Preserve the tier actually served by the provider; Anthropic speed_mode=fast is a separate control from OpenAI service_tier=fast.\n- Context bounds use tier_basis to choose one whole-request bracket, matching the inspected Dashscope behavior. Do not assume graduated charging. Bounds are ordered and converted exactly from source-native intervals. Daily UTC start/end values are paired and ordered.\n- Image/video quality, size and resolution are pricing selectors, not model capability limits. Search-context size applies to search. Cache read/write rules and retention apply to prompt_caching. Unknown or unsupported applicability remains research evidence.\n- Reject duplicate selectors and conflicting equally applicable rows. Keep account/product, capability, operation, modality, currency/credit unit and all applicable scalar selectors compatible before fallback. A book owns its rate visibility; public data must not reference private rates.\n\nSource coverage and remaining limitations:\nThe inspected LiteLLM price file and Bifrost pricing structure both contain the retained ordinary, batch, tiered, cache, image/pixel, duration, request/query/page/session and schedule price families. Our existing imported byte-priced speech uses input_per_million_bytes without equating bytes to characters. Capability support and a price row are independent facts.\n\nSome published tariffs still require additional explicit representation before calculation: exact video-clip duration combined with resolution, weekly schedules and local timezone rules, geography/regulatory uplifts, annotation versus OCR rates, and distinct named hosted-tool charges. Keep these in catalog_sources.details until their typed columns and calculation semantics are designed. Do not apply a conditional tariff universally or claim these sources are fully reproduced by the current table. This viewer revision does not migrate or delete any running database data.\n'''\n}\n\n\nTable catalog_sources [headercolor: #7E6A95] {\n  id uint64 [pk, not null, note: 'Unique internal identifier of this human-review evidence bundle. Uses the uint64 domain described in the project note. Provider/model definitions and pricing rows reference this key.']\n  name text [not null, note: 'Free-form human-readable source label, such as a provider pricing page or an imported catalog. A label is ordinary text, not an enum or a provider identifier.']\n  details jsonb [not null, default: `'{}'::jsonb`, note: '''\nOne human-review document containing the references and investigation context for this bundle. Replaces separate references, observations, acquisition and unresolved columns. Normal configuration queries do not deserialize this document.\n\nShape:\n{\n  references?: [{kind: source_kind, url?: string, revision?: string, fields?: string[], status: evidence_status, note?: string}],\n  retrieval?: [{kind: source_kind, url?: string, access: source_access, authentication?: source_authentication, method?: \"GET\", response?: {format: source_response_format, objectPointer: string, identityPointer: string, identityValue?: string, fields: {configurationPath: {pointer: string, unit: source_unit}}}, pagination?: {pageParameter: string, pageSizeParameter: string, pageSize: integer, totalPagesPointer: string}, note?: string}],\n  findings?: [{field: string, value?: JSONValue, status?: evidence_status, reason?: unresolved_reason, note: string}],\n  raw?: JSONValue\n}\n\nreferences says where stored facts came from. kind lists API, documentation, repository or manual sources. revision pins the exact repository/document version; fields lists the affected configuration paths. evidence_status distinguishes imported facts, deliberate estimates and verified facts.\n\nretrieval describes how to obtain information later, without calling any API during a catalog read. GET is the read-only HTTP method. access distinguishes public sources from ones requiring credentials. Authentication names a method, never a secret. A JSON Pointer such as /data or /id locates a value in a JSON response. identityValue is an exact provider model identifier, so it remains a string. Pagination means retrieving successive result pages instead of assuming the first page is complete. Units prevent confusing dollars per token with dollars per million tokens. A provider_credential recipe requires a matching API-key or OAuth authentication method.\n\nfindings combines observations, uncertainty and conflicts in one list. note explains missing/conditional values or disagreements; reason uses unresolved_reason. JSONValue is an ordinary JSON value retaining numbers, strings, booleans, arrays and objects. raw optionally preserves original external data without claiming it is usable typed configuration.\n\nOnly known sections are present; missing sections mean nothing has been recorded. An empty object is valid research storage and does not mean the model is complete. No global research completeness flag is stored. Secrets and secret-bearing URLs are prohibited. All internal record references, if added, use UInt64String; source-native model IDs, URL paths and JSON pointers remain strings.\nExample: {\"references\":[{\"kind\":\"documentation\",\"url\":\"https://provider.example/pricing\",\"fields\":[\"input_per_million_tokens\"],\"status\":\"verified\"}],\"findings\":[{\"field\":\"max_output_tokens\",\"reason\":\"unpublished\",\"note\":\"The inspected model page does not publish a distinct output ceiling.\"}]}\n''']\n  notes text [note: 'Optional free-form human explanation for reviewers. Null means no additional prose. Structured field findings and retrieval recipes live in details. Notes are never interpreted as executable configuration.']\n\n  Note: '''\nHuman-review evidence bundle: identity, label, one structured document and optional notes. Multiple model/provider/pricing rows can cite the same bundle. No source-specific join tables, index cross-references or research workflow flags are required.\n\nImplementation constraint: details must be a JSON object, follow its documented section shapes and contain no credentials. Provider and model configuration remains typed independently of raw research evidence. This diagram change does not discard or transform data in the running database.\n'''\n}\n\nTable provider_subscription_accounts [headercolor: #64748B] {\n  id uint64 [pk, not null, note: 'Unique internal identifier of a configured provider subscription account. Uses the same unsigned 64-bit ID domain as other internal rows. This record belongs to a real organization account, not to the public model catalog.']\n  organization_id uint64 [not null, note: 'Organization recording and paying for this provider account. Its fee is private account information and must not become a public catalog default. Row security and caller authorization use this organization ownership.']\n  provider_id uint64 [not null, note: 'Foreign key to catalog_providers identifying the subscription-backed provider identity. This is the provider of the paid account, not necessarily the developer of each model. All saved connections attached to this subscription must represent this same provider/account.']\n  account_key text [not null, note: 'Exact external account identifier supplied by or resolved from the provider login. It remains a string because it is an external identifier, unlike this table uint64 primary key. Multiple model deployments or saved connections for the same account must reuse one fee record. Never store an access token, API key or password here.']\n  label text [note: 'Optional human-readable account label for administration. Null means no label; the provider/account identifier still establishes identity. A label does not select models or change pricing.']\n  monthly_fee numeric [not null, note: '''\nOperator-entered fixed fee charged for one monthly subscription period, in the currency described on this row. This is one fee for the account, not one fee per model, request or token. Example: monthly_fee=20 and currency=\"USD\" means US $20 per billing month for that account.\n\nLiteLLM stores monthly_fee on LiteLLM_SubscriptionAccountTable and validates a finite value greater than zero. This target uses PostgreSQL numeric to preserve decimal precision instead of copying its floating-point storage. A missing fee is represented by no configured account-fee row, not a fabricated zero rate. A subscription fee does not establish an unlimited usage entitlement.\n''']\n  currency currency_code [not null, note: 'Currency_code enum specifying the monetary denomination of monthly_fee, such as USD or CNY. Required on the account fee. Matches the inspected subscription currency responsibility while restricting values to explicit standard codes. No JSON wrapper or implicit credit conversion.']\n  billing_period_start date [not null, note: '''\nCalendar date anchoring monthly fee periods. Example: 2026-01-31 anchors starts on January 31, February 28, March 31, and the last available day when another month is shorter. A later long month returns to the original anchor day.\n\nLiteLLM billing_periods_starting_within calculates monthly periods whose start dates fall within an inclusive report range. Its usage report computes fixed_cost = number_of_periods * monthly_fee. It does not store a counter column or prorate these fees by tokens, days or requests. This target uses a PostgreSQL date instead of its date-formatted string. The date is a business billing anchor, not a generic creation timestamp.\n''']\n\n  indexes {\n    (organization_id, provider_id, account_key) [unique]\n  }\n  Note: '''\nConfigured provider-account fee, based on the inspected LiteLLM_SubscriptionAccountTable, SubscriptionAccountFeeRequest and subscription usage calculation. Copies the account-level identity, optional label, monthly fee, currency and monthly anchor responsibilities. Adds our organization ownership and uint64 internal IDs. It is not a reusable subscription-plan catalog and does not invent quotas, overage rules or nonmonthly billing intervals.\n\nMultiple integrated provider connections and all their selected model resources may share one account record, so a report charges the account once per monthly period rather than once per model. Saved connections reference this record through integrated_providers.subscription_account_id. Validate that connection organization/provider identity and actual authenticated external account match the fee record; private provider definitions derived from a public definition require verified equivalent provider identity, not equal display names.\n\nChecks required for implementation: monthly_fee is finite and strictly positive; currency is a supported currency_code enum value; account_key is nonempty and contains no secret. Referenced subscriptions cannot be deleted while a connection still points to them; clear the relation explicitly first. Fee rows with no current connections can remain for account reporting.\n\nSource paths: .dev/litellm/litellm/schema.prisma LiteLLM_SubscriptionAccountTable; types/proxy/management_endpoints/subscription_accounts.py SubscriptionAccountFeeRequest; proxy/management_endpoints/subscription_accounts.py _account_usage; proxy/spend_tracking/subscription_billing_periods.py billing_periods_starting_within. The inspected account-ID resolver registry currently contains ChatGPT only. The schema does not assert implemented automatic account discovery for every provider. Bifrost inspected config-store tables provide usage rates and overrides, not an equivalent subscription-account table.\n\nUnknown fee means unknown fixed cost. Subscription-backed request usage and ordinary metered prices remain separate reported costs, just as LiteLLM displays the account fee alongside metered spend. Public plan observations, restrictions and historical research remain in catalog_sources.details; this schema revision applies no database/data changes.\n'''\n}\n\nTable integrated_providers [headercolor: #64748B] {\n  id uint64 [pk, not null, note: 'Stable internal identity of one installed provider connection in an organization. Multiple integrations may use the same public catalog provider with different names, credentials or private configurations. Configuration changes preserve this identity.']\n  organization_id uint64 [not null, note: 'Organization owning this installed connection, its encrypted credential and selected model memberships. Authority comes from verified membership and database row security, not from a client-supplied identifier.']\n  name text [not null, note: 'Organization-selected integration name, unique within that organization, such as OpenAI production. This labels the installed account/connection and does not replace the catalog provider brand.']\n  provider_catalog_id uint64 [not null, note: '''\nForeign key to the exact public or organization-private catalog_providers definition used by this integration. Connection URL, endpoint requirements, authentication method, timeout, query parameters and public headers live in that definition; they are not duplicated on this table.\n\nOn creation, materialize personal draft configuration as an organization-owned definition before attaching it. An installed organization resource must not depend on the continued membership or private draft visibility of its creator. A genuinely custom provider also receives an authorized catalog definition; the reference is not omitted.\n\nTarget edit behavior: prepare a new complete private configuration copy and move this reference only after validation. Referencing a row pins its identity; the future implementation must enforce snapshot/revision immutability. based_on_id alone is provenance and does not already provide a version-history engine. Never silently edit a shared installed definition or force existing integrations onto an updated public default.\n''']\n  credentials text [note: '''\nOpaque encrypted credential material owned by this installed connection. Required when the selected catalog authentication requires a credential; null is permitted only for an explicitly supported credential-free configuration. Keep the existing protected credential boundary; the catalog describes authentication placement/requirements but never stores the actual secret.\n\nManagement reads do not return plaintext or ciphertext. Replacing a secret encrypts its new value; leaving it unchanged preserves the protected value. Cloning an integration requires its own credential rather than exposing the source secret. Multi-secret OAuth/custom-auth envelopes need their own supported credential implementation; this column does not imply those flows are already implemented.\n''']\n  subscription_account_id uint64 [note: 'Optional foreign key to provider_subscription_accounts for the actual account covering this installed connection. Several integrations and models can share the same monthly fee record. Null means no recorded account-fee association, not free access. Enforce organization, provider identity and actual external-account compatibility.']\n\n  indexes {\n    (organization_id, name) [unique]\n    provider_catalog_id\n    subscription_account_id\n  }\n  Note: '''\nInstalled connection identity, organization ownership, encrypted credential and explicit catalog reference. Selected upstream models are rows in integrated_provider_models, not a duplicate JSON/list column here. There is no provider-wide enabled flag; availability belongs to model selections and later logical-model router bindings.\n\nCreation validates the chosen provider/model configuration, required endpoint/account inputs and credentials, materializes organization-private drafts as needed, then inserts the integration and its selected model links atomically. It requires at least one model membership under the existing create-provider rule; after creation, removing every membership leaves the integration with no enabled models. Saving configuration does not contact an upstream service or prove account access.\n\nPublic or same-organization catalog definitions are allowed; another user personal draft and another organization private configuration are not. Referenced definitions cannot be deleted while installed resources use them. Removing an integration deletes its selection rows after explicit user confirmation, without deleting shared catalog definitions, price books or other integrations. Later routing/usage retention remains its own contract.\n\nSnapshot immutability, model/provider compatibility and matching encrypted-credential/authentication shape need application/database enforcement during implementation. This file maps the agreed storage design only and does not rename running tables or implement catalog revision history.\n'''\n}\n\nTable integrated_provider_models [headercolor: #64748B] {\n  id uint64 [pk, not null, note: 'Stable installed-model identity beneath an integrated provider. Later router bindings and usage records reference this identity, not a transient catalog revision. Configuration edits preserve this identity while the row exists. Disabling removes this row; enabling later creates a new membership row and identity.']\n  integrated_provider_id uint64 [not null, note: 'Foreign key to integrated_providers: the installed connection supplying organization ownership and credentials. Organization is derived from this parent, avoiding a duplicated organization_id column. Row-security policies must enforce the parent organization.']\n  model_catalog_id uint64 [not null, note: '''\nForeign key to the exact complete catalog_models configuration selected for this installed model. The referenced definition owns the provider request identifier, selected/supported operation and protocol configuration, request defaults, capability rows, limits, thinking settings and price-book reference. None of those values are duplicated on this mapping table.\n\nThe selected model must belong to the same provider identity as the parent integration. Organization-private copies may refer back to public definitions, so compare verified provider lineage rather than names or only direct row equality. Reject cross-organization or personal-draft references. Materialize personal model drafts into organization-owned configuration at installation.\n\nThe referenced configuration must establish an unambiguous valid operation/protocol for the supported execution contract. If the catalog stores several alternatives, the concrete selected/default operation belongs in the referenced configuration, not inferred from list order. Configuration edits create a new definition/copy and update this FK after validation; reset changes the reference while preserving this installed-model ID and membership. It never adds back a removed selection implicitly.\n''']\n\n  indexes {\n    (integrated_provider_id, model_catalog_id) [unique]\n    model_catalog_id\n  }\n  Note: '''\nMembership is availability for this integration: row present means enabled; row absent means disabled. There are no disabled membership rows and no enabled flag. Enable inserts a row; disable deletes the row without deleting the catalog definition, capabilities or pricing. Each parent has zero or more selections after creation; the creation flow initially requires at least one selected model. Credentials always come from the installed parent.\n\nThe displayed unique key rejects duplicate references to the exact same configuration in one integration. Also reject duplicate effective upstream identity/operation within the same integration after resolving public/private copies; this requires lineage-aware validation beyond the simple unique index. The integration and all selected configurations must have compatible provider identity and authorized organization scope.\n\nDeleting an unreferenced integration cascades its membership rows; deleting a referenced catalog definition is restricted. Future router bindings can target this membership ID; deletion must follow their separate dependency/retention contract. Historical usage must not be deleted merely to disable a model. Reinserting a selection does not automatically restore old bindings. Merely adding this row does not publish an organization-facing logical model or create a runtime route.\n\nAll internal IDs use uint64. A later implementation must add appropriate parent-scoped RLS, foreign keys and cross-row invariants; this diagram does not change database context/connection infrastructure or runtime permissions.\n'''\n}\n\n\nTable models [headercolor: #64748B] {\n  id uint64 [pk, not null, note: '''\nPrimary key (unique row identifier) of an organization-facing logical model. Routing can associate it with several saved upstream model resources.\n\nUpstream means the external provider service that actually runs the model.\nRouting is the runtime choice of which saved upstream model handles a logical model request.\n''']\n  organization_id uint64 [not null, note: '''\nOrganization owning the logical model, its availability and its selling-price configuration. Does not identify an upstream provider account.\n\nUpstream means the external provider service that actually runs the model.\n''']\n  name text [not null, note: '''\nOrganization-facing logical model name used for discovery and invocation. Distinct from an upstream provider request identifier.\n\nUpstream means the external provider service that actually runs the model.\n''']\n  model_catalog_id uint64 [not null, note: '''\nForeign key (reference to another table row) pointing to the authorized configuration definition for this logical model. Its pricing book represents organization-facing selling prices, separately from upstream cost. The reference does not create a router binding.\n\nUpstream means the external provider service that actually runs the model.\nRouting is the runtime choice of which saved upstream model handles a logical model request.\n''']\n  enabled boolean [not null, note: '''\nWhether the logical model is enabled for invocation. Router bindings, permissions and availability still determine whether a request can execute.\n\nRouting is the runtime choice of which saved upstream model handles a logical model request.\n''']\n\n  Note: 'Existing logical resource: projection only. References its own authorized configuration with organization-facing selling prices. Upstream identity on a cloned definition is provenance, not a router binding. Logical models retain independent routing across upstream resources. Selling prices and upstream costs use separate configurations/books with the same representation.'\n}\n\nRef provider_origin: catalog_providers.based_on_id > catalog_providers.id [delete: restrict]\nRef provider_source: catalog_providers.source_id > catalog_sources.id [delete: restrict]\nRef model_provider: catalog_models.provider_id > catalog_providers.id [delete: restrict]\nRef model_origin: catalog_models.based_on_id > catalog_models.id [delete: restrict]\nRef model_pricing: catalog_models.price_book_id > price_books.id [delete: restrict]\nRef model_source: catalog_models.source_id > catalog_sources.id [delete: restrict]\nRef supported_capabilities: model_capabilities.model_id > catalog_models.id [delete: cascade]\nRef tariff_fallback: price_books.fallback_book_id > price_books.id [delete: restrict]\nRef tariff_source: price_books.source_id > catalog_sources.id [delete: restrict]\nRef book_rates: price_rates.price_book_id > price_books.id [delete: cascade]\nRef rate_evidence: price_rates.source_id > catalog_sources.id [delete: restrict]\nRef subscription_provider: provider_subscription_accounts.provider_id > catalog_providers.id [delete: restrict]\nRef integrated_provider_subscription: integrated_providers.subscription_account_id > provider_subscription_accounts.id [delete: restrict]\nRef integrated_provider_configuration: integrated_providers.provider_catalog_id > catalog_providers.id [delete: restrict]\nRef integrated_model_owner: integrated_provider_models.integrated_provider_id > integrated_providers.id [delete: cascade]\nRef integrated_model_configuration: integrated_provider_models.model_catalog_id > catalog_models.id [delete: restrict]\nRef logical_model_configuration: models.model_catalog_id > catalog_models.id [delete: restrict]\n\nTableGroup Catalog_configuration {\n  catalog_providers\n  catalog_models\n  model_capabilities\n}\nTableGroup Pricing {\n  price_books\n  price_rates\n}\nTableGroup Research {\n  catalog_sources\n}\nTableGroup Installed_integrations_and_logical_models {\n  provider_subscription_accounts\n  integrated_providers\n  integrated_provider_models\n  models\n}\n", "url": "https://dbdiagram.io/embed#c=pako%3AeNrsvely41bWIPhfT4HQTITtCVJMu1x2lfT5q1BKuahSylRp8RoONkhcknCCAAuLlLQ7I%2Fo1%2BiHmKeZN5knmrPcegJRSaaeLnLA7%2BiunCOAu55579uW8LH5y4zo6KuaLOMvmw3Fcx1kxjX7ZiaIE%2Fj2KKzeslwu
