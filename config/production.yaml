settings:
  smtp:
    concurrency: <%= get_env(name="SMTP_CONCURRENCY", default="10") %>
    queue_capacity: <%= get_env(name="SMTP_QUEUE_CAPACITY", default="1024") %>
    admission_timeout_seconds: <%= get_env(name="SMTP_ADMISSION_TIMEOUT_SECONDS", default="30") %>
    send_timeout_seconds: <%= get_env(name="SMTP_SEND_TIMEOUT_SECONDS", default="60") %>
    recipient_cooldown_seconds: <%= get_env(name="SMTP_RECIPIENT_COOLDOWN_SECONDS", default="30") %>
    shutdown_timeout_seconds: <%= get_env(name="SMTP_SHUTDOWN_TIMEOUT_SECONDS", default="60") %>
    enabled: <%= get_env(name="SMTP_ENABLED", default="false") %>
    host: |-
      <%= get_env(name="SMTP_HOST", default="") | indent(width=6) %>
    port: <%= get_env(name="SMTP_PORT", default="587") %>
    from_address: |-
      <%= get_env(name="SMTP_FROM_ADDRESS", default="") | indent(width=6) %>
    username: |-
      <%= get_env(name="SMTP_USERNAME", default="") | indent(width=6) %>
    password: |-
      <%= get_env(name="SMTP_PASSWORD", default="") | indent(width=6) %>
    tls: |-
      <%= get_env(name="SMTP_TLS", default="starttls") | indent(width=6) %>
  auth:
    cookie_secure: <%= get_env(name="AUTH_COOKIE_SECURE", default="true") %>
    public_origin: |-
      <%= get_env(name="AUTH_PUBLIC_ORIGIN", default="") | indent(width=6) %>
    jwt_secret: "<%= get_env(name="AUTH_JWT_SECRET") %>"
    user_token_ttl_seconds: 1800
    refresh_token_ttl_seconds: 2592000

logger:
  enable: true
  pretty_backtrace: false
  level: <%= get_env(name="LOG_LEVEL", default="info") %>
  format: json

server:
  port: <%= get_env(name="PORT", default="3000") %>
  binding: '::'
  host: <%= get_env(name="HOST", default="http://127.0.0.1:3000") %>
  middlewares:
    fallback:
      enable: false

workers:
  mode: BackgroundAsync

database:
  uri: <%= get_env(name="DATABASE_URL") %>
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 10
  auto_migrate: false
  dangerously_truncate: false
  dangerously_recreate: false
