[workspace]
members = ["api", "libs/core", "libs/postgres", "libs/utils", "test"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
async-trait = "0.1"
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = { version = "0.10", features = ["std"] }
hkdf = { version = "0.12", features = ["std"] }
sha2 = "0.10"
email_address = "0.2"
rand = "0.9"
subtle = "2"
thiserror = "2"
axum = "0.8"
axum-frontend = "0.1.3"
clap = { version = "4", features = ["derive"] }
hero = { package = "midwess-hero", version = "1", default-features = false, features = ["distributed-id"] }
loco-rs = { version = "1.2" }
sea-orm = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "6"
utoipa-axum = "0.3"
