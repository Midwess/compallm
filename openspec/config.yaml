schema: spec-driven
context: |
  Compallm is an organization-focused LLM workspace in the Midwess/compallm repository.
  The plan-compallm change captures draft product scope; it is not completed implementation.
  Preserve user-agreed rules: passwordless organization email login, single-use codes
  expiring after 15 minutes, and client-selected API formats translated through a unified format.
  Membership policy, release scope, providers, protocols, budgets, and retention remain open.
  Current application choices: Rust with Loco/Axum, PostgreSQL with SeaORM, React/Vite,
  Utoipa/Orval API contracts, and Hero single-instance Snowflake IDs stored as BIGINT.
  Use npm in developer documentation and avoid requiring a particular Node package manager.
rules:
  proposal:
    - Separate agreed scope from candidate ideas and unresolved decisions.
  specs:
    - Include concrete WHEN/THEN scenarios and do not silently invent business policies.
  tasks:
    - Keep implementation tasks unchecked until implemented and verified.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
