<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Compallm database schema viewer</title>
  <style>
    :root { color-scheme:light; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#20242c; background:#f8fafc; }
    * { box-sizing:border-box; }
    body { margin:0; height:100dvh; min-height:320px; display:flex; flex-direction:column; }
    header { min-height:64px; padding:12px 24px; display:flex; align-items:center; justify-content:space-between; gap:20px; background:#fff; border-bottom:1px solid #e5e7eb; }
    .identity { min-width:0; display:flex; align-items:center; gap:16px; }
    h1 { margin:0; font-size:16px; font-weight:650; letter-spacing:-.02em; white-space:nowrap; }
    .metadata { color:#6b7280; font-size:12px; white-space:nowrap; }
    nav,.actions { display:flex; align-items:center; gap:8px; flex-shrink:0; }
    a,button { border:1px solid #e5e7eb; border-radius:7px; padding:7px 10px; background:#fff; color:#374151; font:inherit; font-size:12px; text-decoration:none; cursor:pointer; }
    a:hover,button:hover { background:#f3f4f6; }
    a:focus-visible,button:focus-visible,textarea:focus-visible { outline:2px solid #6366f1; outline-offset:3px; }
    button:disabled { opacity:.5; cursor:wait; }
    #status { color:#6b7280; font-size:12px; min-width:56px; text-align:right; }
    main { flex:1; min-height:0; position:relative; }
    iframe { width:100%; height:100%; border:0; display:block; background:#fafafa; }
    .diagram-loading { position:absolute; inset:0; z-index:1; display:grid; place-items:center; pointer-events:none; opacity:1; transition:opacity 180ms ease; }
    .diagram-loading[hidden] { display:none; }
    .diagram-loading.finished { opacity:0; }
    .loading-track { position:absolute; inset:0 0 auto; height:3px; overflow:hidden; background:#e8edf4; }
    .loading-track::after { content:""; display:block; width:35%; height:100%; border-radius:999px; background:linear-gradient(90deg,#a5b4cf,#56739e,#a5b4cf); animation:diagram-progress 1.8s ease-in-out infinite; }
    .loading-caption { padding:14px 20px; border:1px solid #e5e7eb; border-radius:12px; background:#ffffffed; box-shadow:0 6px 24px #27344808; color:#536176; font-size:13px; }
    @keyframes diagram-progress { from { transform:translateX(-110%); } to { transform:translateX(400%); } }
    @media(prefers-reduced-motion:reduce) { .diagram-loading { transition:none; } .loading-track::after { animation:none; width:100%; opacity:.65; } }
    dialog { width:min(1080px,calc(100vw - 32px)); height:min(820px,calc(100dvh - 32px)); padding:0; border:1px solid #dbe0e7; border-radius:14px; box-shadow:0 24px 80px #18253b33; }
    dialog::backdrop { background:#11182766; }
    .editor { height:100%; display:flex; flex-direction:column; }
    .editor-header { padding:16px 20px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-bottom:1px solid #e5e7eb; }
    h2 { margin:0; font-size:15px; }
    .editor-header p { margin:5px 0 0; color:#6b7280; font-size:12px; }
    textarea { flex:1; width:100%; min-height:0; margin:0; padding:18px 20px; resize:none; border:0; background:#fbfcfe; color:#273448; font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace; tab-size:2; }
    .editor-footer { padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; border-top:1px solid #e5e7eb; }
    #editor-message { font-size:12px; color:#6b7280; }
    .primary { background:#273448; color:white; border-color:#273448; }
    .primary:hover { background:#354763; }
    @media(max-width:760px) { header { padding:12px; flex-wrap:wrap; gap:10px; } .metadata { display:none; } nav { width:100%; flex-wrap:wrap; } #status { margin-left:auto; } .editor-header,.editor-footer { padding:12px; } }
  </style>
</head>

  <script type="application/json" id="initial-schema">{"dbml": "Project Compallm_catalog {\n  database_type: 'PostgreSQL'\n  Note: '''\nAgreed target: Capability-specific pricing tables share books with explicit fallback; model-to-host routes and research remain separate relations. Three existing saved-resource tables are relationship projections, not complete replacements. A configured subscription-account fee table records account-level monthly charges separately from the public catalog. This file does not apply a migration. Nested enum/JSON contracts describe the target data shape; current Rust structs need a later implementation to match these additions.\n\nPublic rows have neither organization_id nor user_id. Organization-private rows have organization_id. Personal rows have both. References must remain within authorized ownership or point to public data. Public records cannot reference private records.\n\nCustomization clones a complete model and its supported capability rows. based_on_id records origin, not implicit field inheritance. Pricing customization creates a private book with changed rates and an explicit fallback_book_id. Catalog and saved resources resolve through the same Core configuration types.\n\nNormal reads do not load source documents or contact upstream services. Price selection, compatible fallback, cost calculation and runtime limits require Rust implementation. Missing rates stay unknown; zero is explicit. Reject fallback cycles, ambiguous tariffs, incompatible billing inheritance and cross-owner references.\n\n\nInternal identity type:\nuint64 is the unsigned 64-bit integer range 0 through 18446744073709551615. Every internal primary key, foreign key, user ID and organization ID shown here uses this same type. Implement it in PostgreSQL as a uint64 domain over numeric(20,0), with CHECK (VALUE >= 0 AND VALUE \u003c= 18446744073709551615); PostgreSQL bigint is signed and cannot represent the full uint64 range. This is a target domain definition, not a built-in PostgreSQL type or an applied migration.\nUInt64String is the JSON representation of an internal uint64: a base-10 digit string such as \"18446744073709551615\". It avoids loss of precision in JavaScript numbers and decodes into Rust u64; it is not an arbitrary string identity. A concrete resource may disallow zero through its own domain invariant.\nProvider-native request identifiers such as upstream_model_id = \"gpt-example\", URL strings, adapter registration names and source-native keys remain ordinary strings. They are external names, not internal numeric row identities. JSON array positions and counts are ordinary integers, not IDs.\n\nTerms used in column hovers:\nBatch: submit many requests as a background job and collect results later; distinct from sending several normal requests concurrently. Providers may discount batch jobs.\nModality: the kind of content, such as text, image, audio or video. One request can use several modalities.\nToken: a unit created by a model tokenizer; not necessarily one word or one character. One million tokens means 1,000,000 of those units.\nContext window: the total token space available to a model request and its answer, under that provider deployment.\nTariff/rate: a price rule and the amount charged per stated unit. A book groups related price rules.\nService tier: a provider service class, such as priority or flex, that can change latency, capacity or price. It is separate from the batch flag.\nSelector: a condition deciding when a row applies, such as region, image size or service class.\nCache/prefix: stored processing of the initial part of a prompt, reused by later requests. Cache read reuses it; cache write creates it. TTL means time to live: retention duration before expiry.\nReasoning/thinking: a model-specific internal computation mode. Effort is a named level; budget is a token amount. They are not interchangeable.\nEmbedding: a numeric vector representing meaning. Dimensions means the number of values in that vector.\nTool/function call: a model request to run a named operation outside the model. Reserved namespace means a name prefix owned by the provider.\nEndpoint: the server URL/path accepting an operation. Protocol/wire format describes how requests and responses are encoded.\nHTTP header: named request metadata outside the body. JSON body: the structured request content. JSON Pointer: a slash-separated location such as /data/0/id inside JSON.\nPrimary key/ID: a stable row identity. FK/foreign key: a reference to a row in another table. Null: no value; its exact meaning is specified per column. A default: a value used when none is supplied, not a maximum.\nEnum: a closed named choice. JSONB: PostgreSQL structured JSON storage, retaining booleans, numbers, strings, arrays and objects without serializing the entire configuration into text.\n\nAll enum declarations below list allowed target values with explanations. Some enums type JSON discriminators rather than scalar columns. A JSON discriminator is a field such as type/kind selecting one documented object shape. JSONB does not enforce these contracts by itself: the later implementation needs Rust serde types, validation export and database checks. Unknown external fields remain evidence until their typed mapping is supported.\nThis change covers DBML and the embedded review only. Names, IDs, URLs, free-form descriptions and source labels remain strings. Configuration categories use enums; compound or provider-specific settings use documented JSONB. Numeric limits/prices and boolean flags retain their native scalar types.\n'''\n}\n\nEnum capability {\n  text [note: 'Accepts text or generates text; token capacities live on this row.']\n  vision [note: 'Understands image input; does not mean image generation.']\n  pdf [note: 'Accepts PDF documents as model input.']\n  audio [note: 'Accepts audio input, including transcription or audio understanding.']\n  video [note: 'Understands input video or sampled video frames.']\n  image_generation [note: 'Generates image output.']\n  audio_generation [note: 'Generates audio output, such as speech.']\n  search [note: 'Performs or uses search to retrieve results.']\n  reasoning [note: 'Supports provider-specific thinking or reasoning controls.']\n  tool_call [note: 'Can request calls to external functions or tools.']\n  forced_tool_choice [note: 'Can be instructed to call a particular tool or require a tool call.']\n  structured_output [note: 'Can constrain output to JSON or a declared JSON Schema.']\n  embedding [note: 'Produces numeric vectors representing input meaning.']\n  prompt_caching [note: 'Can reuse processed prompt prefixes through implicit or explicit caching.']\n}\n\nEnum service_kind {\n  llm [note: 'Language-model service; LLM means large language model. Includes chat and text completion.']\n  image [note: 'Image generation or editing service.']\n  video [note: 'Video generation or editing service.']\n  embedding [note: 'Converts content into vectors for similarity search or retrieval.']\n  tts [note: 'Text to speech: generates spoken audio from text.']\n  stt [note: 'Speech to text: transcribes audio into text.']\n  audio [note: 'Audio service that does not fit only text-to-speech or speech-to-text.']\n  rerank [note: 'Reorders candidate documents by relevance to a query.']\n  search [note: 'Retrieves documents or web results for a query.']\n  ocr [note: 'Optical character recognition: reads text from images or scanned documents.']\n  moderation [note: 'Classifies content for safety or policy categories.']\n  guardrail [note: 'Checks or filters model requests/responses against policy constraints.']\n  evaluation [note: 'Scores or assesses model output quality.']\n  extraction [note: 'Extracts structured fields from supplied content.']\n  perception [note: 'Nonchat visual/audio sensing, such as labels or object detection.']\n}\n\nEnum operation {\n  chat [note: 'Generates an answer from a sequence of role-labelled messages.']\n  completion [note: 'Continues a text prompt without a chat-message contract.']\n  responses [note: 'Structured response-generation operation that can include messages and tool calls.']\n  embedding [note: 'Generates content vectors.']\n  speech [note: 'Generates spoken audio.']\n  transcription [note: 'Converts speech audio into text.']\n  image_generation [note: 'Generates new images.']\n  image_edit [note: 'Edits an existing image using input instructions or masks.']\n  image_variation [note: 'Generates alternatives derived from an existing image.']\n  video_generation [note: 'Generates a new video.']\n  video_edit [note: 'Edits an existing video.']\n  video_remix [note: 'Creates a modified version of an existing generated video.']\n  rerank [note: 'Reorders candidate results by relevance.']\n  decisions [note: 'Returns a classification or decision using a provider decision endpoint.']\n  ocr [note: 'Extracts text from images/documents.']\n  search [note: 'Executes a search query.']\n  moderation [note: 'Assesses safety categories.']\n  guardrail [note: 'Applies a provider policy check.']\n  evaluation [note: 'Scores supplied content or outputs.']\n  extraction [note: 'Extracts structured information.']\n  vector_store [note: 'Stores or searches embedding vectors.']\n  realtime [note: 'Interactive low-latency session, often bidirectional audio and text.']\n  live [note: 'Provider live multimodal session.']\n  count_tokens [note: 'Counts tokens without generating a model answer.']\n  compaction [note: 'Summarizes or compresses conversation state.']\n  file_storage [note: 'Stores input/output files; pricing can depend on storage duration.']\n  container [note: 'Creates or uses a hosted execution environment, such as a code tool session.']\n  tool_execution [note: 'Executes a separately billed server-side tool.']\n}\n\nEnum protocol {\n  openai [note: 'OpenAI-compatible request/response wire format; does not identify the hosting provider.']\n  openai_responses [note: 'OpenAI Responses wire format.']\n  anthropic [note: 'Anthropic Messages wire format.']\n  gemini [note: 'Google Gemini wire format.']\n  minimax [note: 'MiniMax-native wire format.']\n  openrouter [note: 'OpenRouter-specific wire settings used by existing Core configuration.']\n  xai [note: 'xAI-native wire settings used by existing Core configuration.']\n  bedrock_converse [note: 'AWS Bedrock Converse wire format; catalog-only until an adapter supports it.']\n  bedrock_invoke [note: 'AWS Bedrock InvokeModel format; the model-specific request shape must also be known.']\n  provider_native [note: 'Another provider-native wire format; requires an explicit registered adapter identifier.']\n}\n\nEnum billing_kind {\n  unknown [note: 'No billing category is established; compatible fallback may supply one.']\n  metered [note: 'Pay according to measured usage, such as tokens, images or seconds.']\n  subscription [note: 'Requests are covered by a provider-account subscription. The actual configured account fee is stored separately; no per-model monthly fee is inferred.']\n  free [note: 'Explicitly documented zero-charge access, with restrictions retained separately.']\n}\n\nEnum usage_modality {\n  text [note: 'Text usage component, usually counted in tokens or characters.']\n  image [note: 'Image usage component, counted in tokens, pixels or images.']\n  audio [note: 'Audio usage component, counted in audio tokens, bytes or duration.']\n  video [note: 'Video usage component, counted in video tokens, frames or duration.']\n  document [note: 'Document usage component, often counted in pages or bytes.']\n  reasoning [note: 'Separately reported or billed thinking-token component.']\n}\n\nEnum tier_calculation {\n  whole_request [note: 'Choose one bracket using request size, then price all applicable request usage at that bracket.']\n  graduated [note: 'Split usage across brackets and charge each portion at its bracket rate, like a progressive tariff.']\n}\n\nEnum authentication_kind {\n  api_key [note: 'A provider-issued secret used to authenticate API calls.']\n  o_auth [note: 'OAuth authorization flow obtains access tokens rather than sending a permanent API key. Matches the current Core serialization.']\n  none [note: 'Provider accepts this operation without a credential.']\n  custom [note: 'Authentication requires a named provider-specific adapter, such as request signing.']\n}\n\nEnum oauth_flow {\n  authorization_code [note: 'User signs in through a provider page; the application exchanges a returned code for tokens.']\n  device_code [note: 'User approves a short code in a separate browser/device flow.']\n  client_credentials [note: 'Server authenticates as an application using client credentials.']\n}\n\nEnum endpoint_mode {\n  fixed [note: 'Provider publishes a common endpoint URL.']\n  account_specific [note: 'Endpoint depends on account, resource, deployment or region inputs.']\n  discovered [note: 'Endpoint is obtained from a documented discovery process.']\n  unknown [note: 'A usable endpoint configuration has not been established.']\n}\n\nEnum configuration_input_kind {\n  string [note: 'Plain string input, such as a deployment name.']\n  url [note: 'Validated absolute URL input.']\n  object [note: 'Structured JSON object input.']\n  positive_integer [note: 'Whole number greater than zero.']\n  price [note: 'Validated nonnegative decimal monetary input.']\n}\n\nEnum tier_basis {\n  input_tokens [note: 'Choose the bracket using request input tokens only.']\n  total_tokens [note: 'Choose the bracket using input plus output tokens, where the published tariff says so.']\n}\n\nEnum cache_charge_kind {\n  separate_rate [note: 'Use a separately published cache price.']\n  estimated_rate [note: 'Use a declared cache-price estimate; preserve evidence that it is estimated.']\n  standard_input_rate [note: 'Cached input is charged at the ordinary input price.']\n  included [note: 'Cache usage is included without an additional charge.']\n  unsupported [note: 'This caching/billing operation is explicitly unsupported.']\n}\n\nEnum reasoning_effort {\n  none [note: 'No reasoning effort requested, where the model accepts disabling it.']\n  minimal [note: 'Smallest named reasoning level below low.']\n  low [note: 'Low named reasoning level.']\n  medium [note: 'Medium named reasoning level.']\n  high [note: 'High named reasoning level.']\n  xhigh [note: 'Extra-high named reasoning level.']\n  max [note: 'Maximum named reasoning level.']\n  custom [note: 'Another provider-specific effort label; nativeValue is required and no equivalence to a known level is assumed.']\n}\n\nEnum reasoning_context {\n  auto [note: 'Provider chooses how much conversation reasoning context to use.']\n  current_turn [note: 'Use reasoning context for the current conversational turn.']\n  all_turns [note: 'Use reasoning context across all relevant turns.']\n}\n\nEnum parameter_kind {\n  string [note: 'String parameter.']\n  integer [note: 'Whole-number parameter.']\n  number [note: 'Numeric parameter.']\n  boolean [note: 'True/false parameter.']\n  object [note: 'JSON object parameter.']\n  array [note: 'JSON array parameter.']\n}\n\nEnum source_kind {\n  api [note: 'Information obtainable through a programmatic endpoint.']\n  documentation [note: 'Published web documentation or pricing page.']\n  repository [note: 'Source code or a data file at a pinned revision.']\n  manual [note: 'Human-supplied information needing explicit evidence/confidence.']\n}\n\nEnum source_access {\n  public [note: 'Readable without provider credentials.']\n  provider_credential [note: 'Requires the registered provider API key or OAuth token.']\n  manual [note: 'Human review is needed; not an automatically callable source.']\n  unknown [note: 'Access requirements have not been established.']\n  unavailable [note: 'Source is known to be unavailable.']\n}\n\nEnum source_authentication {\n  none [note: 'No authentication needed.']\n  provider_api_key [note: 'Requires the provider API key.']\n  provider_oauth [note: 'Requires a provider OAuth token.']\n  unknown [note: 'Authentication requirements unknown.']\n}\n\nEnum evidence_status {\n  imported [note: 'Copied from another source; not independently verified.']\n  estimate [note: 'Approximation deliberately retained as a fallback.']\n  verified [note: 'Checked against evidence for the exact provider/product/model.']\n}\n\nEnum source_response_format {\n  model_list [note: 'Response contains multiple model objects; select the exact model identifier.']\n  model_object [note: 'Response describes one model object.']\n}\n\nEnum source_unit {\n  identifier [note: 'Model/provider identifier.']\n  text [note: 'Human-readable text.']\n  tokens [note: 'Tokenizer units.']\n  usd_per_token [note: 'US dollars per one token.']\n  usd_per_million_tokens [note: 'US dollars per one million tokens.']\n  provider_native [note: 'Provider-native value requiring a documented interpretation.']\n  bytes [note: 'Bytes.']\n  milliseconds [note: 'Milliseconds.']\n  count [note: 'Whole-item count.']\n  dimensions [note: 'Vector dimensions.']\n}\n\nEnum denomination_kind {\n  fiat [note: 'Money denominated in a named real-world currency, such as USD or CNY.']\n  credits [note: 'Provider-native units requiring an explicit conversion before reporting money.']\n}\n\nEnum service_tier_kind {\n  standard [note: 'Ordinary processing and its baseline tariff; provider APIs may call this default.']\n  auto [note: 'Request lets the provider choose a tier. It is not a priced served tier; use the response-reported tier for cost.']\n  priority [note: 'Higher-priority processing with its own applicable rates.']\n  flex [note: 'Flexible scheduling or availability, commonly a distinct discounted tariff.']\n  fast [note: 'Provider-specific fast processing class. OpenAI fast and Anthropic speed=fast must not be assumed equivalent.']\n  balanced [note: 'Balanced processing class recognized by the inspected LiteLLM price-key lookup.']\n  ultrafast [note: 'Ultrafast processing class with distinct rate keys where published.']\n  provisioned [note: 'Provider provisioned/reserved capacity class. A label alone does not establish per-token charges.']\n  custom [note: 'Another exact provider class. native_service_tier or nativeValue is required; an adapter must interpret it.']\n}\n\nEnum capability_charge_kind {\n  usage [note: 'Use the applicable nonnegative numeric usage rates on this capability row.']\n  free [note: 'Explicit evidence establishes no charge for this capability within its stated restrictions.']\n  included [note: 'Capability is covered by another charge, such as reasoning already counted in text output. Do not add another usage charge.']\n  model_billing [note: 'Covered by the separately configured model/provider-account billing arrangement; not a claim that the account costs zero.']\n}\n\nEnum rate_basis {\n  tokens [note: 'Count tokenizer units; columns normalize the price to one million tokens.']\n  characters [note: 'Count characters under the documented provider rule, priced per million.']\n  utf8_bytes [note: 'Count UTF-8 encoded bytes, priced per million bytes; not character count.']\n  seconds [note: 'Count media duration or explicitly documented service duration; not assumed server latency.']\n  images [note: 'Count billable images.']\n  pixels [note: 'Count billable image pixels under the provider counting rule.']\n  videos [note: 'Count complete generated videos.']\n  requests [note: 'Count provider API requests.']\n  queries [note: 'Count provider-defined search or rerank queries.']\n  pages [note: 'Count billable document pages.']\n  sessions [note: 'Count provider-defined tool/service sessions; retain their lifetime definition.']\n}\n\nEnum provider_speed_mode {\n  standard [note: 'Ordinary provider speed setting, separate from the service_tier field.']\n  fast [note: 'Provider speed=fast, such as Anthropic fast mode, whose prices are distinct from OpenAI service_tier=fast.']\n}\n\nEnum quality_kind {\n  auto [note: 'Provider selects generation quality.']\n  low [note: 'Low generation quality.']\n  medium [note: 'Medium generation quality.']\n  high [note: 'High generation quality.']\n  standard [note: 'Provider standard quality.']\n  hd [note: 'Provider high-definition quality.']\n  premium [note: 'Provider premium quality.']\n  custom [note: 'Another exact native label; nativeValue is required.']\n}\n\nEnum unresolved_reason {\n  unknown [note: 'No exact fact has been established.']\n  unpublished [note: 'Inspected sources do not publish this fact.']\n  account_specific [note: 'Depends on a particular account, deployment or plan.']\n  requires_authentication [note: 'Retrieving the information requires provider credentials.']\n  conditional [note: 'The fact depends on additional conditions, such as region or tier.']\n  not_applicable [note: 'The field has no meaning for this service.']\n  deprecated [note: 'Provider explicitly retired the model or operation.']\n  no_public_endpoint [note: 'No publicly listed hosting endpoint has been found.']\n  unsupported_adapter [note: 'The required request/response translation is not implemented.']\n  source_conflict [note: 'Sources disagree and the conflict is unresolved.']\n}\n\nEnum conditional_field_rule {\n  when_effort_none [note: 'Field is accepted only when reasoning effort is none.']\n  requires_reasoning [note: 'Field requires a reasoning-enabled request.']\n  requires_tool_call [note: 'Field requires tool-calling support/context.']\n  requires_native_adapter [note: 'A named registered adapter must interpret this condition before dispatch.']\n}\n\nEnum bedrock_api {\n  converse [note: 'AWS Bedrock Converse message API.']\n  invoke [note: 'AWS Bedrock InvokeModel API with a model-specific request body.']\n  messages [note: 'AWS-hosted Anthropic Messages API.']\n  chat_completions [note: 'OpenAI-compatible Chat Completions API on a Bedrock endpoint.']\n  responses [note: 'OpenAI-compatible Responses API on a Bedrock endpoint.']\n}\n\nEnum bedrock_reasoning_shape {\n  reasoning_text [note: 'Reasoning content represented by text with provider-required signature metadata.']\n  redacted_content [note: 'Reasoning represented by an opaque provider blob that must be preserved.']\n}\n\nEnum bedrock_base_path {\n  v1 [note: 'Base path /v1 on the selected Bedrock endpoint.']\n  \"openai/v1\" [note: 'Base path /openai/v1 on the selected Bedrock endpoint.']\n}\n\nEnum quantization_kind {\n  fp32 [note: '32-bit floating-point model representation.']\n  fp16 [note: '16-bit floating-point model representation.']\n  bf16 [note: '16-bit brain floating-point representation with a wider exponent range than fp16.']\n  fp8 [note: '8-bit floating-point representation.']\n  int8 [note: '8-bit integer quantized representation.']\n  int4 [note: '4-bit integer quantized representation.']\n  custom [note: 'Another provider-published numeric representation; preserve its exact nativeValue.']\n}\n\nEnum search_context_size {\n  low [note: 'Small provider-defined retrieved search-context tier.']\n  medium [note: 'Medium provider-defined retrieved search-context tier.']\n  high [note: 'Large provider-defined retrieved search-context tier.']\n}\n\nTable catalog_providers [headercolor: #426B9A] {\n  id uint64 [pk, not null, note: 'Stable primary key (the unique row identifier) of this reusable provider definition. Private clones receive their own identity; saved providers reference this key.']\n  organization_id uint64 [note: 'Organization owning private provider configuration. Null with user_id null means public; a value with user_id null means organization-private. Refers to the existing organization table.']\n  user_id uint64 [note: 'User owning personal provider configuration within organization_id. Null means no personal owner. A nonnull user requires a nonnull organization and matching authorization.']\n  based_on_id uint64 [note: '''\nOptional FK to the provider definition cloned to create this one. Null means no recorded origin. Records provenance only; connection fields do not inherit automatically.\n\nA foreign key (FK) references the identifier of another database row.\n''']\n  name text [not null, note: 'Provider display name shown in discovery and configuration, such as OpenAI. It is not a base URL or an authentication identifier.']\n  description text [note: 'Optional human-readable explanation of the provider or product. Null means no description has been recorded.']\n  logo_url text [note: 'Root-relative asset path or absolute uploaded image URL.']\n  connection jsonb [not null, note: '''\nConnection is a typed configuration object, not a URL string:\n{\n  baseUrl: string | null,\n  path: string | null,\n  timeoutMs: positiveInteger | null,\n  query: {queryParameterName: string},\n  authentication: Authentication | null,\n  endpoint: {\n    mode: endpoint_mode,\n    urlTemplate: string | null,\n    requiredInputs: ConfigurationInput[]\n  },\n  adapter: {name: string, parameters: object} | null,\n  compatibility: Compatibility | null\n}\nbaseUrl is the upstream server address. path is appended to it. timeoutMs is the maximum wait in milliseconds, where 1000 ms = 1 second. query holds non-secret URL parameters. urlTemplate uses named account inputs when a common URL is insufficient. adapter identifies provider-specific request handling; storing it does not implement it.\n\nAuthentication uses the existing Rust tagged shape {type, configuration}:\napi_key: {placement: Placement | null, requiredInputs: ConfigurationInput[]}\no_auth: {flow: oauth_flow | null, authorizationUrl: string | null, tokenUrl: string | null, deviceAuthorizationUrl: string | null, scopes: string[], tokenPlacement: Placement | null, requiredInputs: ConfigurationInput[]}\nnone: omit configuration; no credential required.\ncustom: {adapter: string | null, parameters: {name: string}, requiredInputs: ConfigurationInput[]}\nThe type values are authentication_kind; o_auth is the current Core spelling. OAuth scopes name access rights requested from the provider. A header or query placement describes WHERE a credential is inserted, never its value.\n\nPlacement is one of {apiKeyHeader: {name: string, prefix: string}} or {apiKeyQuery: string}. A common header example is {apiKeyHeader: {name: \"Authorization\", prefix: \"Bearer \"}}. No API keys, OAuth access tokens, cookies or client secrets belong in these catalog objects.\n\nCompatibility = {\n  fieldNames?: {logicalFieldName: nativeFieldName},\n  unsupportedFields?: string[],\n  conditionalFields?: [{field: string, condition: {kind: conditional_field_rule, adapter?: string}}],\n  requiredHeaders?: {headerName: publicHeaderValue},\n  serverTools?: {logicalToolName: nativeVersionedToolName},\n  supportedOperations?: operation[],\n  supportedServiceTiers?: [{kind: service_tier_kind, nativeValue?: string}],\n  bedrockApis?: bedrock_api[],\n  bedrockReasoningShape?: bedrock_reasoning_shape,\n  bedrockBasePath?: bedrock_base_path\n}\nfieldNames maps logical names such as max_tokens to provider names such as max_completion_tokens. Unsupported means the server rejects that field. Conditional fields require an implemented interpretation; unknown conditions cannot be treated as accepted. Server tools are provider-hosted tools with versioned names, such as a web-search tool. Bedrock is the AWS model-hosting service; its native APIs and opaque reasoning formats are distinct wire contracts.\nConfigurationInput = {name: string, kind: configuration_input_kind, required: boolean, allowedValues: string[] | null}. It describes a value the user must supply, such as region or deployment name; it is not the supplied secret itself.\n''']\n  headers jsonb [not null, default: `'{}'::jsonb`, note: '''\nAn object mapping HTTP header names to non-secret string values, matching the current Core Headers map:\n{\"Anthropic-Version\": \"2023-06-01\"}\nHeaders are request metadata sent outside the JSON body. An empty object means no extra defaults. Names are unique ignoring letter case; values must be valid header values. Authorization secrets are stored on the saved provider, never here. A later override uses the same case-insensitive name matching.\n''']\n  authentication_options jsonb [not null, default: `'[]'::jsonb`, note: '''\nList of the Authentication objects documented on connection. Allows a provider to offer API-key and OAuth access without selecting a secret. Example: [{\"type\":\"none\"}]. An empty list means no additional methods are recorded, not proof that authentication is unnecessary. Never includes credential values.\n''']\n  source_id uint64 [note: '''\nOptional FK to the human-review evidence bundle in catalog_sources. Null means no linked evidence bundle. Normal configuration queries do not load that document.\n\nA foreign key (FK) references the identifier of another database row.\n''']\n\n  indexes {\n    (organization_id, user_id)\n    based_on_id\n  }\n  Note: '''Reusable public/private provider definition. Saved providers own encrypted credentials separately. Account-specific endpoint settings use a private definition. Missing upstream facts remain optional until configured.\n\nDatabase CHECK requirements for implementation:\nprovider_owner_shape: user_id IS NULL OR organization_id IS NOT NULL\nprovider_not_own_origin: based_on_id IS NULL OR based_on_id \u003c> id\nprovider_connection_object: jsonb_typeof(connection) = \"object\"\nprovider_headers_object: jsonb_typeof(headers) = \"object\"; header names are case-insensitively unique\n'''\n}\n\nTable catalog_models [headercolor: #426B9A] {\n  id uint64 [pk, not null, note: 'Stable primary key (the unique row identifier) of this model configuration definition. Distinct from the provider request identifier and from a saved model resource ID.']\n  provider_id uint64 [not null, note: 'Foreign key (reference to another table row) pointing to catalog_providers identifying the provider definition for this model. The same underlying model can have separate definitions for different providers.']\n  organization_id uint64 [note: 'Organization owning a private model definition. Null with user_id null means public. Personal copies also set user_id; visibility and references must respect this ownership.']\n  user_id uint64 [note: 'Owner of a personal model definition within organization_id. Null means the definition is public or organization-private, depending on organization_id.']\n  based_on_id uint64 [note: '''\nOrigin of a complete private clone; not a model-name fallback rule.\n\nFallback means consulting the explicitly referenced book for missing values under compatible conditions; it does not switch the serving model.\n''']\n  upstream_model_id text [not null, note: 'Exact provider request identifier, distinct from database identity and display name.']\n  display_name text [note: 'Optional friendly label shown in the UI. Null allows display of upstream_model_id. Does not change the identifier sent to the provider.']\n  description text [note: 'Optional human-readable model description. Null means no description has been recorded; it does not block known configuration.']\n  service_kind service_kind [note: '''\nWhat kind of service this model provides. Allowed values are listed in the service_kind enum. llm means language generation; tts means text to speech; stt means speech to text; ocr means reading text from scans; rerank means reordering search candidates. Null means not yet classified. This broad category is separate from operation: one language service may support both chat and responses. Additional catalog categories do not establish executable adapter support.\n''']\n  connections jsonb [not null, default: `'{}'::jsonb`, note: '''\nObject keyed by protocol enum values, each containing the Connection contract documented on catalog_providers.connection. Example:\n{\"openai\": {\"baseUrl\": \"https://api.example.com/v1\", \"path\": \"/chat/completions\", \"timeoutMs\": 30000, \"query\": {}, \"authentication\": null, \"endpoint\": {\"mode\": \"fixed\", \"urlTemplate\": null, \"requiredInputs\": []}}}\nProtocol means the request/response wire format, not the provider brand. Allowed keys are exactly the protocol enum. An empty object means no recorded supported wire configuration, not a usable connection. Unknown native protocols require provider_native with an explicit adapter name; do not relabel them OpenAI-compatible without evidence.\n\n\nConnection is a typed configuration object, not a URL string:\n{\n  baseUrl: string | null,\n  path: string | null,\n  timeoutMs: positiveInteger | null,\n  query: {queryParameterName: string},\n  authentication: Authentication | null,\n  endpoint: {\n    mode: endpoint_mode,\n    urlTemplate: string | null,\n    requiredInputs: ConfigurationInput[]\n  },\n  adapter: {name: string, parameters: object} | null,\n  compatibility: Compatibility | null\n}\nbaseUrl is the upstream server address. path is appended to it. timeoutMs is the maximum wait in milliseconds, where 1000 ms = 1 second. query holds non-secret URL parameters. urlTemplate uses named account inputs when a common URL is insufficient. adapter identifies provider-specific request handling; storing it does not implement it.\n\nAuthentication uses the existing Rust tagged shape {type, configuration}:\napi_key: {placement: Placement | null, requiredInputs: ConfigurationInput[]}\no_auth: {flow: oauth_flow | null, authorizationUrl: string | null, tokenUrl: string | null, deviceAuthorizationUrl: string | null, scopes: string[], tokenPlacement: Placement | null, requiredInputs: ConfigurationInput[]}\nnone: omit configuration; no credential required.\ncustom: {adapter: string | null, parameters: {name: string}, requiredInputs: ConfigurationInput[]}\nThe type values are authentication_kind; o_auth is the current Core spelling. OAuth scopes name access rights requested from the provider. A header or query placement describes WHERE a credential is inserted, never its value.\n\nPlacement is one of {apiKeyHeader: {name: string, prefix: string}} or {apiKeyQuery: string}. A common header example is {apiKeyHeader: {name: \"Authorization\", prefix: \"Bearer \"}}. No API keys, OAuth access tokens, cookies or client secrets belong in these catalog objects.\n\nCompatibility = {\n  fieldNames?: {logicalFieldName: nativeFieldName},\n  unsupportedFields?: string[],\n  conditionalFields?: [{field: string, condition: {kind: conditional_field_rule, adapter?: string}}],\n  requiredHeaders?: {headerName: publicHeaderValue},\n  serverTools?: {logicalToolName: nativeVersionedToolName},\n  supportedOperations?: operation[],\n  supportedServiceTiers?: [{kind: service_tier_kind, nativeValue?: string}],\n  bedrockApis?: bedrock_api[],\n  bedrockReasoningShape?: bedrock_reasoning_shape,\n  bedrockBasePath?: bedrock_base_path\n}\nfieldNames maps logical names such as max_tokens to provider names such as max_completion_tokens. Unsupported means the server rejects that field. Conditional fields require an implemented interpretation; unknown conditions cannot be treated as accepted. Server tools are provider-hosted tools with versioned names, such as a web-search tool. Bedrock is the AWS model-hosting service; its native APIs and opaque reasoning formats are distinct wire contracts.\nConfigurationInput = {name: string, kind: configuration_input_kind, required: boolean, allowedValues: string[] | null}. It describes a value the user must supply, such as region or deployment name; it is not the supplied secret itself.\n''']\n  headers jsonb [not null, default: `'{}'::jsonb`, note: '''\nAn object mapping HTTP header names to non-secret string values, matching the current Core Headers map:\n{\"Anthropic-Version\": \"2023-06-01\"}\nHeaders are request metadata sent outside the JSON body. An empty object means no extra defaults. Names are unique ignoring letter case; values must be valid header values. Authorization secrets are stored on the saved provider, never here. A later override uses the same case-insensitive name matching.\n\nModel-level defaults combine with provider headers under the shared request rules.\n''']\n  body_defaults jsonb [not null, default: `'{}'::jsonb`, note: '''\nJSON object of default request-body fields. The body is the content sent to the model, separate from HTTP headers. Example: {\"temperature\": 0.7, \"top_p\": 0.9}.\ntemperature usually adjusts randomness; top_p is nucleus sampling, selecting from a probability mass; provider support and ranges vary. Keys must be accepted by the selected operation/protocol and values keep their native JSON type. Host-selection preferences, such as OpenRouter provider.order/only/allow_fallbacks, also live here and reference the native host labels recorded by catalog_model_routes; they do not duplicate the route membership list. Booleans/numbers are not stringified. This is a typed request-default map validated against capability parameter descriptors, not an arbitrary provider response. Empty object means no extra body defaults. Capability limit and pricing columns remain the authorities for those settings.\n''']\n\n  price_book_id uint64 [note: '''\nDirect pricing FK. Multiple models may reference the same book. Null means no assigned pricing.\n\nA foreign key (FK) references the identifier of another database row.\n''']\n  source_id uint64 [note: '''\nOptional FK to model research evidence in catalog_sources, including field confidence and unresolved findings in its details document. Normal model reads do not deserialize it.\n\nA foreign key (FK) references the identifier of another database row.\n''']\n\n  indexes {\n    (provider_id, upstream_model_id)\n    (organization_id, user_id, based_on_id)\n    price_book_id\n  }\n  Note: '''\nComplete provider-specific model configuration. The same underlying model may have different features, limits and prices through different providers. Token limits belong to the text capability; money belongs to pricing books.\n\nImplement partial unique indexes for public (provider_id, upstream_model_id) identity and one private customization per original model and ownership scope. Custom private models without an origin use scope-aware upstream identity. Private copies retain their exact request identity without colliding with public originals.\n\nCapability membership stores supported features only. A missing row means no recorded support; it does not establish confirmed lack of support. Explicit negative observations and uncertainty remain in catalog_sources. A private copy owns its capability set, including an explicitly empty set.\n\n\nDatabase CHECK requirements for implementation:\nmodel_owner_shape: user_id IS NULL OR organization_id IS NOT NULL\nmodel_not_own_origin: based_on_id IS NULL OR based_on_id \u003c> id\nmodel_connections_object: jsonb_typeof(connections) = \"object\"; every key is a protocol enum and every value satisfies Connection\nmodel_headers_object: jsonb_typeof(headers) = \"object\"\nmodel_body_object: jsonb_typeof(body_defaults) = \"object\"\n'''\n}\n\nTable catalog_model_routes [headercolor: #426B9A] {\n  id uint64 [pk, not null, note: 'Unique internal identifier of one provider-host route for an offered model. Uses the same full-range uint64 domain as every other internal ID. A route is a possible place to execute the model, not an already active request or saved provider connection.']\n  model_id uint64 [not null, note: 'Foreign key to catalog_models: the model offered through the entry provider. For example this can be the OpenRouter model requested by the client. Its provider_id identifies the entry service and its request identifier remains on that model. A model may have several host-route rows.']\n  provider_id uint64 [not null, note: 'Foreign key to catalog_providers: the actual hosting company behind this route, such as DeepSeek or DeepInfra. This can differ from model_id provider, such as OpenRouter. This describes hosting through the entry service; it does not authorize a direct API call using the host credentials. Match exact provider/product/region evidence, not a similar name.']\n  configuration_model_id uint64 [note: 'Optional foreign key to a route-specific catalog_models definition containing the verified capabilities, limits and request settings for this hosted deployment. Null means those route-specific facts have not been mapped. A direct-host model record may be referenced only when evidence establishes the same deployment/configuration; equal model names alone are insufficient. When present its provider_id must match this row provider_id.']\n  price_book_id uint64 [note: 'Optional foreign key to the tariff charged for this model through this entry-service/host route. It may differ from the direct-host tariff because an aggregator can apply its own prices. Null means no assigned route tariff; do not silently substitute direct-host prices. Explicitly approved pricing estimates use their own book/source evidence and normal book fallback.']\n  configuration jsonb [not null, default: `'{}'::jsonb`, note: '''\nTyped host selector and endpoint metadata needed by the entry-provider adapter:\n{\n  nativeProvider: string,\n  endpointSlug?: string,\n  region?: {code: string},\n  quantization?: {kind: quantization_kind, nativeValue?: string},\n  supportedOperations?: operation[]\n}\nnativeProvider preserves the exact hosting label accepted by the entry service, for example \"DeepSeek\" inside OpenRouter provider preferences. It is an external request value, not an internal ID. endpointSlug identifies a particular provider-published endpoint where available. region is its exact provider region code. Quantization describes the numeric representation of model weights and can affect deployment behavior; custom requires nativeValue. Do not infer a quantization, region or operation from model-name similarity.\n\nThis JSON contains no prices, duplicated capability limits, credentials, selected flag or independent fallback policy. Model body_defaults holds the entry-provider request policy. A typical OpenRouter request uses {provider:{order:[\"DeepSeek\"],allow_fallbacks:false}}. order is the desired host order and allow_fallbacks permits the entry provider to choose another host after failure. It differs from price-book fallback, which only supplies missing tariff information. An exact allowlist uses the provider documented only field rather than pretending a preferred order is a guaranteed restriction.\n\nSupported operations describe catalog evidence, not implemented execution. An empty object is incomplete selector metadata and must not be treated as an executable route. Internal model/provider/book links are SQL foreign keys above; native labels remain strings. The adapter must validate that requested host labels correspond to authorized route rows when it provides a host-selection UI.\n''']\n  source_id uint64 [note: 'Optional foreign key to catalog_sources containing evidence for this exact offered-model/host mapping. A source-code request example proves the request shape, not current host availability or a complete host list. Live provider endpoint observations belong in details with their original response.']\n\n  indexes {\n    (model_id, provider_id)\n    configuration_model_id\n    price_book_id\n  }\n  Note: '''\nExplicit relation between an offered catalog model and one possible hosting provider. For example an OpenRouter model can link to a DeepSeek host while retaining OpenRouter as the entry provider. No catalog-wide canonical-model alias is inferred, and no gateway router binding is created.\n\nmodel_id is the parent that owns route visibility; private customization clones applicable route rows when the user needs independent host settings. provider_id, configuration_model_id, price_book_id and source_id must be visible in that same authorized scope or be public. Deleting an unreferenced parent definition cascades its route rows. Referenced hosts/configurations/books/evidence are protected from deletion.\n\nWhen configuration_model_id is present, enforce configuration_model.provider_id = provider_id through a database constraint trigger or an equivalent composite foreign-key design. All internal IDs use uint64. Reject duplicate (model_id, provider_id, nativeProvider, endpointSlug, region) selector identities with canonical JSON-aware uniqueness. A route row cannot establish model equivalence, availability or pricing without corresponding evidence. Target configuration references are one-hop facts and do not recursively execute another route table.\n\nSource-backed design: LiteLLM schema.prisma LiteLLM_ProxyModelTable stores model_name plus litellm_params/model_info JSON; types/router.py Deployment models those fields. Its OpenRouter transform_request merges extra_body into the request, and its tests explicitly pass provider.order=[\"DeepSeek\"] with allow_fallbacks=false for openrouter/deepseek/deepseek-chat. That request shape informs this table; LiteLLM does not declare this exact relational table. Provider-specific order/weight fields on gateway deployments are not copied as universal public-host selection rules.\n\nInitialization example, with symbolic references rather than fabricated numeric IDs: model_id references the OpenRouter deepseek/deepseek-chat definition; provider_id references the DeepSeek host; configuration={nativeProvider:\"DeepSeek\"}; configuration_model_id and price_book_id remain null until exact deployment/tariff evidence exists. This is an example of the supported shape, not a verified inventory or a migration seed.\n'''\n}\n\nTable model_capabilities [headercolor: #5B8F7A] {\n  model_id uint64 [not null, note: 'Foreign key (reference to another table row) pointing to the public or private catalog_models definition owning this capability. Combined with capability, uniquely identifies the row. Deleting an unreferenced definition deletes its capability rows.']\n  capability capability [not null, note: 'Supported feature represented by this row, such as text, vision, reasoning or embedding. The enum selects applicable limit columns and typed configuration. Only supported features have rows. A missing row means no recorded support; explicit negative observations remain research evidence.']\n  context_window bigint [note: '''\nText only: total input-plus-output token capacity. Known actual input plus actual output must fit this window. Null means unknown on an imported definition or no configured gateway cap on a private definition; upstream restrictions still apply.\n\nUpstream means the external provider service that actually runs the model.\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  max_input_tokens bigint [note: '''\nText only: independent input-token ceiling. May equal the entire context window even when an output ceiling exists. Null means no recorded/configured ceiling, never zero. A known value must fit a known context_window.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  max_output_tokens bigint [note: '''\nText only: independent generated-output token ceiling. This is neither the default nor the minimum. Null means no recorded/configured ceiling; the provider can still enforce one. Known values must fit a known context_window.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  min_output_tokens bigint [note: '''\nText only: minimum accepted value of the requested output-token cap. Null means unknown. Explicit zero means no provider floor. This is not a minimum actual response length.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  default_output_tokens bigint [note: '''\nText only: output-token cap used when a request omits it, if known or configured. Null leaves default selection to the request/provider rules. A known default must satisfy known output floor, ceiling and context bounds.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  min_budget_tokens bigint [note: '''\nReasoning only: minimum accepted explicit thinking-token budget. Null means unknown; zero can be a valid published bound. Whether zero disables thinking is controlled by supportsDisable, not inferred from this value.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  max_budget_tokens bigint [note: '''\nReasoning only: maximum accepted explicit thinking-token budget. Null means unknown. Must not be below a known minimum; interaction with output tokens follows the provider-specific reasoning contract.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  default_budget_tokens bigint [note: '''\nReasoning only: explicit thinking-token budget used by default, when known or configured. Null means no explicit default. A known value fits known minimum/maximum bounds. Automatic mode is represented separately.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  max_images integer [note: 'Vision or image_generation: maximum image count for the applicable operation. Positive when known. Null means no recorded/configured count cap. Operation-specific restrictions must not become universal model claims.']\n  max_files integer [note: 'PDF capability: maximum document/file count for the applicable operation. Positive when known; null means no recorded/configured count cap.']\n  max_pages integer [note: 'PDF capability: maximum page count within the documented file or request scope. Positive when known; null means no recorded/configured page cap. Preserve the exact scope in configuration/evidence.']\n  max_bytes bigint [note: '''\nMedia capability: maximum bytes per item for vision, PDF, audio, audio_generation or video. Positive when known; null means no recorded/configured byte cap. Counts bytes, not tokens or base64 characters.\n\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  max_total_bytes bigint [note: 'Media capability: maximum aggregate bytes across items in one applicable operation. Independent of max_bytes per item. Positive when known; null means no recorded/configured aggregate cap.']\n  max_duration_ms bigint [note: 'Audio, audio_generation or video: maximum duration in milliseconds within the documented operation scope. Positive when known; null means no recorded/configured duration cap.']\n  max_frames integer [note: 'Video capability: maximum accepted frame count for the applicable operation. Positive when known; null means no recorded/configured frame cap. Does not imply a frame rate.']\n  max_tools integer [note: 'Tool calling: maximum declared tools accepted for the applicable operation. Positive when known; null means no recorded/configured tool-count cap. Not a maximum number of executed tool calls.']\n  max_name_length integer [note: '''\nTool calling: maximum tool-name length accepted on the wire. Positive when known; null means unknown. Preserve whether the provider measures characters or bytes; do not substitute one unit for the other.\n\nWire format means the exact field names and data encoding sent to the provider.\n''']\n  max_results integer [note: 'Search capability: maximum returned result count for the applicable operation. Positive when known; null means no recorded/configured result-count cap.']\n  default_dimensions integer [note: 'Embedding capability: default vector length, measured in dimensions. Positive when known. Null means no recorded default; this is not an inferred maximum. Must belong to supported_dimensions when both are specified.']\n  supported_dimensions integer[] [note: 'Embedding capability: explicitly accepted vector lengths. Null means the accepted set is unknown. A present array is nonempty, positive and duplicate-free. A single published default does not establish this set.']\n  min_prefix_tokens bigint [note: '''\nPrompt caching: minimum cacheable prefix length in tokens for this provider/model. Null means unknown. Explicit zero means no minimum threshold. A runtime fallback must not be presented as a published model fact.\n\nFallback means consulting the explicitly referenced book for missing values under compatible conditions; it does not switch the serving model.\nTokens are units created by the model tokenizer; one token need not equal one word or character.\n''']\n  max_breakpoints integer [note: 'Prompt caching: maximum explicitly configured cache breakpoints for the applicable operation. Positive when known; null means unknown. An absent value does not establish implicit or explicit caching support.']\n  configuration jsonb [not null, default: `'{}'::jsonb`, note: '''\nCapability-specific settings that are not already columns. The capability enum selects one shape. Optional keys mean unknown/unconfigured; false is an explicit negative. Prices and numeric capability-limit columns are never repeated here.\n\ntext = {input?: boolean, output?: boolean, outputCapRequired?: boolean, supportsSystemMessages?: boolean, supportsDeveloperRole?: boolean, supportsAssistantPrefill?: boolean, supportsSampling?: boolean, supportedParameters?: ParameterDescriptor[]}\nvision = {formats?: string[]}\npdf = {formats?: string[]}\naudio / audio_generation = {formats?: string[]}\nvideo = {formats?: string[]}\nimage_generation = {formats?: string[], supportedSizes?: [{width: integer, height: integer}], supportedQualities?: Quality[]}\nreasoning = {supportedEfforts?: ReasoningLevel[], effortMapping?: [{level: ReasoningLevel, nativeValue: string}], defaultEffort?: ReasoningLevel, supportsBudget?: boolean, supportsDisable?: boolean, supportsAutomaticBudget?: boolean, alwaysEnabled?: boolean, supportedContexts?: reasoning_context[], supportsAdaptive?: boolean, supportsInterleaved?: boolean, supportsWithTools?: boolean, supportsRedaction?: boolean, supportsBetweenTools?: boolean, supportsDisplayUpdates?: boolean}\ntool_call = {reservedNamespaces?: string[], parallelCalls?: boolean, supportsNamespaces?: boolean, supportsAsync?: boolean, supportsCustomTools?: boolean, supportsMultimodalOutput?: boolean}\nforced_tool_choice = {acceptedChoices?: string[]}\nstructured_output = {jsonMode?: boolean, jsonSchema?: boolean, native?: boolean, supportsWithTools?: boolean, supportsRegexLookaround?: boolean}\nsearch = {dynamicQueries?: boolean, webFetch?: boolean}\nembedding = {encodingFormats?: string[]}\nprompt_caching = {supportsExplicit?: boolean, supportsImplicit?: boolean, supportedTtlSeconds?: integer[], supportsScope?: boolean}\n\nReasoningLevel = {kind: reasoning_effort, nativeValue?: string} | {kind: \"custom\", nativeValue: string}. The known levels are none, minimal, low, medium, high, xhigh, max; custom retains an exact provider level without guessing an equivalent. Effort is a named amount of thinking, not a token count. Adaptive means the model decides how much to think; interleaved means thinking can occur between tool calls; redaction means hidden/removed reasoning content.\nQuality = {kind: quality_kind, nativeValue?: string}; nativeValue preserves an exact provider quality name when kind=custom.\nParameterDescriptor = {name: string, kind: parameter_kind, minimum?: number, maximum?: number, default?: JSONValue, allowedValues?: JSONValue[], help?: string}. A parameter is a named request input, such as temperature; parameter_kind lists allowed JSON types. Its default must satisfy its known bounds and choices. Listing a parameter does not establish an unknown numeric range. JSONValue is a valid JSON scalar, array or object, not encoded JSON text.\n\nformats contains provider MIME/file-format identifiers, such as image/png or wav. JSON mode requests JSON text; JSON Schema specifies allowed object structure. Native means the provider enforces it directly; an emulated schema via tools is different. Regex lookaround is a regular-expression feature not accepted by all schema engines. A reserved tool namespace is a name prefix owned by the provider. Async tools may finish later rather than during the immediate response. Caching is reuse of prompt processing; implicit means automatic reuse, explicit means request-controlled. TTL is retention duration in seconds.\n\nEvery capability may also have operationOverrides: [{operation: operation, endpoint?: string, limits?: CapabilityLimitPatch, configuration?: CapabilitySettings}]. CapabilityLimitPatch has exactly the applicable numeric/array limit column names and types from this row; only present keys override, and explicit null clears a configured gateway cap. CapabilitySettings is the chosen shape above without nested operationOverrides. This preserves adapter-specific limits without claiming they apply to all operations.\n\nNumeric reasoning budgets, embedding dimensions, image counts, media sizes, tool counts and cache thresholds are visible columns. Provider sentinels such as -1 for automatic reasoning are represented by support flags and translated by an adapter, not stored as negative ordinary limits. Cross-capability dependencies remain enforced by domain/database validation. An unknown or unsupported provider feature stays research evidence until a typed implementation is available.\n''']\n\n  indexes {\n    (model_id, capability) [pk]\n    (capability, model_id)\n  }\n  Note: '''\nOnly supported capabilities have rows. Rust maintains the full capability list. Absence means no recorded support, not proof of lack of support. No model-wide completeness flag is stored.\n\nInput/output ceilings are independent: their sum may exceed context_window. Actual input plus actual output must fit the context at request ication, method?: \"GET\", response?: {format: source_response_format, objectPointer: string, identityPointer: string, identityValue?: string, fields: {configurationPath: {pointer: string, unit: source_unit}}}, pagination?: {pageParameter: string, pageSizeParameter: string, pageSize: integer, totalPagesPointer: string}, note?: string}],\n  findings?: [{field: string, value?: JSONValue, status?: evidence_status, reason?: unresolved_reason, note: string}],\n  raw?: JSONValue\n}\n\nreferences says where stored facts came from. kind lists API, documentation, repository or manual sources. revision pins the exact repository/document version; fields lists the affected configuration paths. evidence_status distinguishes imported facts, deliberate estimates and verified facts.\n\nretrieval describes how to obtain information later, without calling any API during a catalog read. GET is the read-only HTTP method. access distinguishes public sources from ones requiring credentials. Authentication names a method, never a secret. A JSON Pointer such as /data or /id locates a value in a JSON response. identityValue is an exact provider model identifier, so it remains a string. Pagination means retrieving successive result pages instead of assuming the first page is complete. Units prevent confusing dollars per token with dollars per million tokens. A provider_credential recipe requires a matching API-key or OAuth authentication method.\n\nfindings combines observations, uncertainty and conflicts in one list. note explains missing/conditional values or disagreements; reason uses unresolved_reason. JSONValue is an ordinary JSON value retaining numbers, strings, booleans, arrays and objects. raw optionally preserves original external data without claiming it is usable typed configuration.\n\nOnly known sections are present; missing sections mean nothing has been recorded. An empty object is valid research storage and does not mean the model is complete. No global research completeness flag is stored. Secrets and secret-bearing URLs are prohibited. All internal record references, if added, use UInt64String; source-native model IDs, URL paths and JSON pointers remain strings.\nExample: {\"references\":[{\"kind\":\"documentation\",\"url\":\"https://provider.example/pricing\",\"fields\":[\"input_per_million_tokens\"],\"status\":\"verified\"}],\"findings\":[{\"field\":\"max_output_tokens\",\"reason\":\"unpublished\",\"note\":\"The inspected model page does not publish a distinct output ceiling.\"}]}\n''']\n  notes text [note: 'Optional free-form human explanation for reviewers. Null means no additional prose. Structured field findings and retrieval recipes live in details. Notes are never interpreted as executable configuration.']\n\n  Note: '''\nHuman-review evidence bundle: identity, label, one structured document and optional notes. Multiple model/provider/pricing rows can cite the same bundle. No source-specific join tables, index cross-references or research workflow flags are required.\n\nImplementation constraint: details must be a JSON object, follow its documented section shapes and contain no credentials. Provider and model configuration remains typed independently of raw research evidence. This diagram change does not discard or transform data in the running database.\n'''\n}\n\nTable provider_subscription_accounts [headercolor: #64748B] {\n  id uint64 [pk, not null, note: 'Unique internal identifier of a configured provider subscription account. Uses the same unsigned 64-bit ID domain as other internal rows. This record belongs to a real organization account, not to the public model catalog.']\n  organization_id uint64 [not null, note: 'Organization recording and paying for this provider account. Its fee is private account information and must not become a public catalog default. Row security and caller authorization use this organization ownership.']\n  provider_id uint64 [not null, note: 'Foreign key to catalog_providers identifying the subscription-backed provider identity. This is the provider of the paid account, not necessarily the developer of each model. All saved connections attached to this subscription must represent this same provider/account.']\n  account_key text [not null, note: 'Exact external account identifier supplied by or resolved from the provider login. It remains a string because it is an external identifier, unlike this table uint64 primary key. Multiple model deployments or saved connections for the same account must reuse one fee record. Never store an access token, API key or password here.']\n  label text [note: 'Optional human-readable account label for administration. Null means no label; the provider/account identifier still establishes identity. A label does not select models or change pricing.']\n  monthly_fee numeric [not null, note: '''\nOperator-entered fixed fee charged for one monthly subscription period, in the currency described on this row. This is one fee for the account, not one fee per model, request or token. Example: monthly_fee=20 and currency=\"USD\" means US $20 per billing month for that account.\n\nLiteLLM stores monthly_fee on LiteLLM_SubscriptionAccountTable and validates a finite value greater than zero. This target uses PostgreSQL numeric to preserve decimal precision instead of copying its floating-point storage. A missing fee is represented by no configured account-fee row, not a fabricated zero rate. A subscription fee does not establish an unlimited usage entitlement.\n''']\n  currency char(3) [not null, note: 'Uppercase three-letter monetary currency code of monthly_fee, such as USD or CNY. Matches LiteLLM account-fee semantics; no JSON wrapper or implicit credit conversion.']\n  billing_period_start date [not null, note: '''\nCalendar date anchoring monthly fee periods. Example: 2026-01-31 anchors starts on January 31, February 28, March 31, and the last available day when another month is shorter. A later long month returns to the original anchor day.\n\nLiteLLM billing_periods_starting_within calculates monthly periods whose start dates fall within an inclusive report range. Its usage report computes fixed_cost = number_of_periods * monthly_fee. It does not store a counter column or prorate these fees by tokens, days or requests. This target uses a PostgreSQL date instead of its date-formatted string. The date is a business billing anchor, not a generic creation timestamp.\n''']\n\n  indexes {\n    (organization_id, provider_id, account_key) [unique]\n  }\n  Note: '''\nConfigured provider-account fee, based on the inspected LiteLLM_SubscriptionAccountTable, SubscriptionAccountFeeRequest and subscription usage calculation. Copies the account-level identity, optional label, monthly fee, currency and monthly anchor responsibilities. Adds our organization ownership and uint64 internal IDs. It is not a reusable subscription-plan catalog and does not invent quotas, overage rules or nonmonthly billing intervals.\n\nMultiple providers connections and all their model resources may share one account record, so a report charges the account once per monthly period rather than once per model. Saved connections reference this record through providers.subscription_account_id. Validate that connection organization/provider identity and actual authenticated external account match the fee record; private provider definitions derived from a public definition require verified equivalent provider identity, not equal display names.\n\nChecks required for implementation: monthly_fee is finite and strictly positive; currency is exactly three uppercase letters; account_key is nonempty and contains no secret. Referenced subscriptions cannot be deleted while a connection still points to them; clear the relation explicitly first. Fee rows with no current connections can remain for account reporting.\n\nSource paths: .dev/litellm/litellm/schema.prisma LiteLLM_SubscriptionAccountTable; types/proxy/management_endpoints/subscription_accounts.py SubscriptionAccountFeeRequest; proxy/management_endpoints/subscription_accounts.py _account_usage; proxy/spend_tracking/subscription_billing_periods.py billing_periods_starting_within. The inspected account-ID resolver registry currently contains ChatGPT only. The schema does not assert implemented automatic account discovery for every provider. Bifrost inspected config-store tables provide usage rates and overrides, not an equivalent subscription-account table.\n\nUnknown fee means unknown fixed cost. Subscription-backed request usage and ordinary metered prices remain separate reported costs, just as LiteLLM displays the account fee alongside metered spend. Public plan observations, restrictions and historical research remain in catalog_sources.details; this schema revision applies no database/data changes.\n'''\n}\n\nTable providers [headercolor: #64748B] {\n  id uint64 [pk, not null, note: 'Primary key (unique row identifier) of the saved organization-owned provider connection. Distinct from the reusable provider catalog definition.']\n  organization_id uint64 [not null, note: 'Organization owning the saved connection and encrypted credential. Authorization and database row security restrict access to that organization.']\n  name text [not null, note: 'Organization-selected connection name, unique within that organization. Multiple saved connections may use the same catalog provider with different credentials.']\n  provider_catalog_id uint64 [not null, note: 'Foreign key (reference to another table row) pointing to the authorized public/private provider configuration used by this connection. Account-specific settings use a private definition. Credentials remain on this saved resource.']\n  subscription_account_id uint64 [note: 'Optional foreign key to the configured provider_subscription_accounts record covering this saved connection. Null means no account fee is linked, not free or zero-price usage. Several connections/models may share the same account. Fixed fees are counted by subscription account, not multiplied by the number of attached models.']\n  credentials text [not null, note: 'Opaque encrypted provider credential using the existing credential-storage format. Internal execution may decrypt through the authorized cipher; management responses and catalog rows must not expose it.']\n\n  indexes {\n    (organization_id, name) [unique]\n  }\n  Note: 'Existing saved resource: projection of ownership and target configuration reference only. Other business fields and relationships remain. Account-specific endpoint and header values use a referenced private definition.'\n}\n\nTable provider_models [headercolor: #64748B] {\n  id uint64 [pk, not null, note: '''\nPrimary key (unique row identifier) of a saved upstream model resource under one configured provider. Distinct from its reusable catalog configuration identity.\n\nUpstream means the external provider service that actually runs the model.\n''']\n  organization_id uint64 [not null, note: '''\nOrganization owning the saved upstream model. Must match the parent provider and be authorized to access the referenced configuration.\n\nUpstream means the external provider service that actually runs the model.\n''']\n  provider_id uint64 [not null, note: '''\nForeign key (reference to another table row) pointing to the saved providers connection used for upstream access and credentials. Must belong to the same organization.\n\nUpstream means the external provider service that actually runs the model.\n''']\n  model_catalog_id uint64 [not null, note: '''\nForeign key (reference to another table row) pointing to the complete public/private model configuration supplying the request identifier, capabilities, limits, request defaults and upstream pricing book. Must be compatible with the parent saved provider.\n\nUpstream means the external provider service that actually runs the model.\n''']\n  enabled boolean [not null, note: '''\nWhether this saved upstream resource is enabled for use by routing. True does not prove valid credentials, upstream availability or an active router binding.\n\nUpstream means the external provider service that actually runs the model.\nRouting is the runtime choice of which saved upstream model handles a logical model request.\n''']\n\n  Note: 'Existing saved upstream resource: projection only. Configuration, supported capabilities, limits and upstream cost resolve through model_catalog_id. Enforce organization/provider consistency. Existing routing relationships are omitted.'\n}\n\nTable models [headercolor: #64748B] {\n  id uint64 [pk, not null, note: '''\nPrimary key (unique row identifier) of an organization-facing logical model. Routing can associate it with several saved upstream model resources.\n\nUpstream means the external provider service that actually runs the model.\nRouting is the runtime choice of which saved upstream model handles a logical model request.\n''']\n  organization_id uint64 [not null, note: '''\nOrganization owning the logical model, its availability and its selling-price configuration. Does not identify an upstream provider account.\n\nUpstream means the external provider service that actually runs the model.\n''']\n  name text [not null, note: '''\nOrganization-facing logical model name used for discovery and invocation. Distinct from an upstream provider request identifier.\n\nUpstream means the external provider service that actually runs the model.\n''']\n  model_catalog_id uint64 [not null, note: '''\nForeign key (reference to another table row) pointing to the authorized configuration definition for this logical model. Its pricing book represents organization-facing selling prices, separately from upstream cost. The reference does not create a router binding.\n\nUpstream means the external provider service that actually runs the model.\nRouting is the runtime choice of which saved upstream model handles a logical model request.\n''']\n  enabled boolean [not null, note: '''\nWhether the logical model is enabled for invocation. Router bindings, permissions and availability still determine whether a request can execute.\n\nRouting is the runtime choice of which saved upstream model handles a logical model request.\n''']\n\n  Note: 'Existing logical resource: projection only. References its own authorized configuration with organization-facing selling prices. Upstream identity on a cloned definition is provenance, not a router binding. Logical models retain independent routing across upstream resources. Selling prices and upstream costs use separate configurations/books with the same representation.'\n}\n\nRef provider_origin: catalog_providers.based_on_id > catalog_providers.id [delete: restrict]\nRef provider_source: catalog_providers.source_id > catalog_sources.id [delete: restrict]\nRef model_provider: catalog_models.provider_id > catalog_providers.id [delete: restrict]\nRef model_origin: catalog_models.based_on_id > catalog_models.id [delete: restrict]\nRef model_pricing: catalog_models.price_book_id > price_books.id [delete: restrict]\nRef model_source: catalog_models.source_id > catalog_sources.id [delete: restrict]\nRef route_offered_model: catalog_model_routes.model_id > catalog_models.id [delete: cascade]\nRef route_host_provider: catalog_model_routes.provider_id > catalog_providers.id [delete: restrict]\nRef route_host_configuration: catalog_model_routes.configuration_model_id > catalog_models.id [delete: restrict]\nRef route_tariff: catalog_model_routes.price_book_id > price_books.id [delete: restrict]\nRef route_evidence: catalog_model_routes.source_id > catalog_sources.id [delete: restrict]\nRef supported_capabilities: model_capabilities.model_id > catalog_models.id [delete: cascade]\nRef tariff_fallback: price_books.fallback_book_id > price_books.id [delete: restrict]\nRef tariff_source: price_books.source_id > catalog_sources.id [delete: restrict]\nRef tariff_text: price_book_text_rates.price_book_id > price
