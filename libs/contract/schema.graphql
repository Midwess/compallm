schema {
  query: Query
  mutation: Mutation
}

"How the request delivers credentials; this is never stored in signed claims."
enum CredentialDelivery {
  "Set HttpOnly cookies and return metadata without credential values."
  COOKIE
  "Return credentials explicitly without setting browser cookies."
  TOKEN
}

enum FilterIs {
  NULL
  NOT_NULL
}

enum HomeDestination {
  CHAT
  MODELS
  PROVIDERS
}

enum ImageMediaType {
  JPEG
  PNG
  WEBP
}

enum OrderByDirection {
  AscNullsFirst
  AscNullsLast
  DescNullsFirst
  DescNullsLast
}

enum PreferenceAppearanceMode {
  SYSTEM
  LIGHT
  DARK
}

enum PreferenceBadgeStyle {
  DOT
  COUNT
}

enum PreferenceCodeTheme {
  FOLLOW_INTERFACE
  SYSTEM
  LINEAR_LIGHT
  LINEAR_DARK
}

enum PreferenceDarkPalette {
  BASIC_DARK
  BLUEBERRY_DARK
  MARSHMALLOW_DARK
}

enum PreferenceDestination {
  CHAT
  MODELS
  PROVIDERS
  NOTEBOOKS
  PLUGINS
  STATS
  API_KEYS
  MEMBERS
  CONVERSATIONS
}

enum PreferenceFontFamily {
  DEFAULT
  MONOSPACE
}

enum PreferenceKeyCombination {
  ENTER
  MODIFIER_ENTER
}

enum PreferenceLightPalette {
  BASIC_WHITE
  BLUEBERRY_WHITE
  MARSHMALLOW_WHITE
}

enum PreferenceNamingFormat {
  FULL_NAME
  USERNAME
}

enum PreferencePixelFontSize {
  PX12
  PX13
  PX14
  PX16
}

enum PreferenceRelativeFontSize {
  SMALLER
  SMALL
  DEFAULT
  LARGE
  LARGER
}

enum PreferenceSidebarCategory {
  WORKSPACE
  ROUTERS
  ORGANIZATION
  CONVERSATIONS
}

enum PreferenceSidebarVisibility {
  ALWAYS
  WHEN_BADGED
  HIDDEN
}

enum PreferenceWeekday {
  MONDAY
  SUNDAY
  TUESDAY
  WEDNESDAY
  THURSDAY
  FRIDAY
  SATURDAY
}

"Catalog connection family hint; each configured model selects its own operation."
enum ProviderApiProtocol {
  OPENAI_COMPATIBLE
  ANTHROPIC
  PROVIDER_SPECIFIC
}

"Capabilities declared by a catalog or configured model; not an authorization grant."
enum ProviderModelCapability {
  TEXT
  VISION
  PDF
  AUDIO
  VIDEO
  IMAGE_GENERATION
  AUDIO_GENERATION
  SEARCH
  REASONING
  TOOL_CALL
  FORCED_TOOL_CHOICE
  STRUCTURED_OUTPUT
}

"Text operation determining the upstream request and response format."
enum TextModelProtocol {
  OPENAI_CHAT_COMPLETIONS
  OPENAI_RESPONSES
  ANTHROPIC_MESSAGES
}

enum UserPreferenceGroup {
  NAVIGATION
  SIDEBAR
  MEMBER_DISPLAY
  CALENDAR
  THEME
  TYPOGRAPHY
  ACCESSIBILITY
  MESSAGE_COMPOSITION
  CODE_APPEARANCE
  ALL
}

input AccessibilityPatchInput {
  underlineLinks: Boolean
  reduceMotion: Boolean
  pointerCursors: Boolean
}

input CalendarPatchInput {
  firstDay: PreferenceWeekday
}

input ChatCreateInput {
  message: String!
  modelId: String!
}

input CodeAppearancePatchInput {
  theme: PreferenceCodeTheme
  font: CodeFontPatchInput
}

input CodeFontPatchInput {
  family: PreferenceFontFamily
  size: PreferencePixelFontSize
}

input CredentialCreateInput {
  name: String!
}

"""
Shared input for confirming a signup or signin email challenge.

The verified encrypted challenge comes from request context, never this input.
The adapter calls `validify()` before Core verifies the code and challenge.
"""
input EmailCodeInput {
  "Exactly six ASCII digits after trimming surrounding whitespace."
  code: String!
  "Cookie delivery is the default; token delivery must be requested explicitly."
  delivery: CredentialDelivery = COOKIE
}

"""
Shared input for requesting either a signup or a signin email challenge.

Call `validify()` before Core execution. GraphQL parsing alone does not run
normalization, application validation, or email ownership checks.
"""
input EmailInput {
  "Trimmed and ASCII-lowercased using the shared Rust email policy."
  email: String!
  "Cookie delivery is the default; token delivery must be requested explicitly."
  delivery: CredentialDelivery = COOKIE
}

input GroupCreateInput {
  name: String!
  description: String!
  roleIds: [String!]!
}

input GroupUpdateInput {
  name: String
  description: String
  addMemberIds: [String!]
  removeMemberIds: [String!]
  addRoleIds: [String!]
  removeRoleIds: [String!]
}

input ImageUploadInput {
  mediaType: ImageMediaType!
  size: Int!
}

input MemberDisplayPatchInput {
  nameFormat: PreferenceNamingFormat
}

input MemberFilterInput {
  displayName: StringFilter
  email: StringFilter
  or: [MemberMatchInput!]
}

input MemberMatchInput {
  displayName: StringFilter
  email: StringFilter
}

input MemberOrderInput {
  id: OrderByDirection
  displayName: OrderByDirection
  email: OrderByDirection
}

input MessageCompositionPatchInput {
  convertEmoticons: Boolean
  sendShortcut: PreferenceKeyCombination
}

input NavigationPatchInput {
  home: PreferenceDestination
}

input OrganizationProfileUpdateInput {
  name: String
  avatarUploaded: Boolean = false
}

input OrganizationSettingsUpdateInput {
  name: String
  slug: String
  fiscalMonth: String
  welcome: String
  announcements: String
  home: HomeDestination
}

input PalettePatchInput {
  light: PreferenceLightPalette
  dark: PreferenceDarkPalette
}

input ProfileUpdateInput {
  name: String
  username: String
}

"Opaque registry identity, independent of an edited upstream model name."
input ProviderCatalogRef {
  provider: String!
  model: String!
}

"New connection definition; credentials and header values are write-only."
input ProviderCreateInput {
  name: String!
  baseUrl: String!
  apiKey: String!
  headers: [ProviderHeader!]!
  models: [ProviderModelWrite!]!
}

"Empty object means no configured effort levels. Configured values cannot be empty."
input ProviderEffortMapping {
  low: String
  medium: String
  high: String
  xhigh: String
  max: String
}

input ProviderHeader {
  key: String!
  "Write-only header content; never returned by management reads."
  value: String!
}

"Omit value to retain an existing header secret; new names require a value."
input ProviderHeaderUpdate {
  key: String!
  "Omit to preserve the saved value for this header name. New names require a value."
  value: String
}

"Complete configured text-model values. Decimal prices are USD per million tokens."
input ProviderModelConfiguration {
  name: String!
  protocol: TextModelProtocol!
  path: String!
  maxContextTokens: ContextTokens!
  enabled: Boolean! = true
  effortMapping: ProviderEffortMapping
  capabilities: [ProviderModelCapability!]! = []
  catalogRef: ProviderCatalogRef
  inputPrice: String!
  outputPrice: String!
  cachedPrice: String!
}

"Persisted identity is omitted for new models and forbidden during provider creation."
input ProviderModelWrite {
  "Omit for a new model; supplied IDs must belong to this connection."
  id: ID
  "Complete text-model configuration, including explicit token prices."
  configuration: ProviderModelConfiguration!
}

"Partial update. Omitted fields are unchanged; explicit null is rejected."
input ProviderPatchInput {
  name: String
  baseUrl: String
  "Omit to preserve the current credential. Empty strings and null are invalid."
  apiKey: String
  headers: [ProviderHeaderUpdate!]
  models: [ProviderModelWrite!]
}

"Full non-secret replacement. Omitting apiKey preserves the saved credential."
input ProviderReplaceInput {
  name: String!
  baseUrl: String!
  "Omit to preserve the current credential. Empty strings and null are invalid."
  apiKey: String
  headers: [ProviderHeaderUpdate!]!
  models: [ProviderModelWrite!]!
}

"Atomic batch of new provider connections for the verified organization."
input ProvidersCreateInput {
  providers: [ProviderCreateInput!]!
}

input ReportingScheduleInput {
  timezone: String!
}

input RoleCreateInput {
  name: String!
  description: String!
  "Comments and unnecessary whitespace are removed before the length limit is checked."
  cedarSource: String!
}

input RoleUpdateInput {
  name: String
  description: String
  "Comments and unnecessary whitespace are removed before the length limit is checked."
  cedarSource: String
}

input SidebarLayoutSectionInput {
  category: PreferenceSidebarCategory!
  items: [PreferenceDestination!]!
}

"Order replaces ordering while preserving visibility; visibility patches are keyed by destination."
input SidebarPatchInput {
  layout: [SidebarLayoutSectionInput!]
  order: [PreferenceDestination!]
  visibility: [SidebarVisibilityPatchInput!]
  badgeStyle: PreferenceBadgeStyle
}

input SidebarVisibilityPatchInput {
  item: PreferenceDestination!
  visibility: PreferenceSidebarVisibility!
}

input SpendingLimitInput {
  amount: String
}

input StringFilter {
  eq: String
  gt: String
  gte: String
  in: [String!]
  lt: String
  lte: String
  neq: String
  is: FilterIs
  startsWith: String
  like: String
  ilike: String
  regex: String
  iregex: String
}

input ThemePatchInput {
  mode: PreferenceAppearanceMode
  palettes: PalettePatchInput
}

input TypographyPatchInput {
  family: PreferenceFontFamily
  size: PreferenceRelativeFontSize
}

"Partial personal preferences. Omitted fields are preserved; explicit null is rejected."
input UserPreferencesPatchInput {
  navigation: NavigationPatchInput
  sidebar: SidebarPatchInput
  memberDisplay: MemberDisplayPatchInput
  calendar: CalendarPatchInput
  theme: ThemePatchInput
  typography: TypographyPatchInput
  accessibility: AccessibilityPatchInput
  messageComposition: MessageCompositionPatchInput
  codeAppearance: CodeAppearancePatchInput
}

input UserProfileUpdateInput {
  displayName: String
  username: String
  avatarUploaded: Boolean = false
}

"Positive u32 context size, encoded as an exact JSON number (1–4294967295)."
scalar ContextTokens

type AccessibilityPreferences {
  underlineLinks: Boolean!
  reduceMotion: Boolean!
  pointerCursors: Boolean!
}

type AvatarUpload {
  url: String!
  fields: [UploadFormField!]!
  "Expiration as Unix seconds, encoded as a string."
  expiresAt: String!
}

type AvatarUploadPayload {
  node: AvatarUpload!
}

type BooleanPayload {
  node: Boolean!
}

type CalendarPreferences {
  firstDay: PreferenceWeekday!
}

type CodeAppearancePreferences {
  theme: PreferenceCodeTheme!
  font: CodeFontPreferences!
}

type CodeFontPreferences {
  family: PreferenceFontFamily!
  size: PreferencePixelFontSize!
}

"Email admission succeeded; cookie delivery never exposes the OTP credential."
type EmailChallenge {
  lifetime: TokenLifetime!
  token: String
}

type EmailChallengePayload {
  node: EmailChallenge!
}

type Group {
  id: ID!
  name: String!
  description: String!
  roles: RoleConnection!
  memberIds: [ID!]!
}

type GroupConnection {
  edges: [GroupEdge!]!
  pageInfo: PageInfo!
}

type GroupEdge {
  cursor: String!
  node: Group!
}

type GroupPayload {
  node: Group!
}

type Member {
  id: ID!
  displayName: String!
  email: String!
  available: Boolean!
}

type MemberConnection {
  edges: [MemberEdge!]!
  pageInfo: PageInfo!
}

type MemberDisplayPreferences {
  nameFormat: PreferenceNamingFormat!
}

type MemberEdge {
  cursor: String!
  node: Member!
}

type MessageCompositionPreferences {
  convertEmoticons: Boolean!
  sendShortcut: PreferenceKeyCombination!
}

type Mutation {
  organizationProfileUpdate(input: OrganizationProfileUpdateInput!): OrganizationPayload!
  generateOrgAvatarUrl(input: ImageUploadInput!): AvatarUploadPayload!
  groupUpdate(id: ID!, input: GroupUpdateInput!): GroupPayload!
  groupDelete(id: ID!): BooleanPayload!
  "Update the current user's display name and confirm an uploaded avatar."
  userProfileUpdate(input: UserProfileUpdateInput!): UserPayload!
  "Authorize a direct JPEG/PNG/WebP avatar upload up to 5 MiB for five minutes."
  generateUrlAvatarUrl(input: ImageUploadInput!): AvatarUploadPayload!
  "Atomically patch the signed-in user's preferences, preserving omitted fields."
  userPreferencesUpdate(input: UserPreferencesPatchInput!): UserPreferencesPayload!
  "Restore selected preference groups, or ALL alone, to Core defaults."
  userPreferencesReset(groups: [UserPreferenceGroup!]!): UserPreferencesPayload!
  "Request a signup email challenge; reject existing accounts before sending."
  emailSignupRequest(input: EmailInput!): EmailChallengePayload!
  "Confirm the verified signup challenge and create the account and session."
  emailSignupConfirm(input: EmailCodeInput!): SessionCredentialsPayload!
  "Request a signin email challenge for an existing active account."
  emailSigninRequest(input: EmailInput!): EmailChallengePayload!
  "Confirm the verified signin challenge and create a scoped session."
  emailSigninConfirm(input: EmailCodeInput!): SessionCredentialsPayload!
  "Refresh using explicit refresh Bearer authority; leave browser cookies unchanged."
  sessionRefresh: SessionCredentialsPayload!
  "Revoke the verified session and clear its browser cookies after success."
  sessionRevoke: BooleanPayload!
  "Create a role in the verified active organization."
  roleCreate(input: RoleCreateInput!): RolePayload!
  roleDelete(id: ID!): BooleanPayload!
  roleUpdate(id: ID!, input: RoleUpdateInput!): RolePayload!
  "Create a group and its initial role assignments in the verified active organization."
  groupCreate(input: GroupCreateInput!): GroupPayload!
}

type NavigationPreferences {
  home: PreferenceDestination!
}

type Organization {
  avatarUrl: String
  canUpdateProfile: Boolean!
  id: ID!
  name: String!
}

type OrganizationPayload {
  node: Organization!
}

type PageInfo {
  startCursor: String
  endCursor: String
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
}

type PalettePreferences {
  light: PreferenceLightPalette!
  dark: PreferenceDarkPalette!
}

type PolicyAction {
  name: String!
  displayName: String!
  description: String!
  entityType: String!
  resourceType: String!
}

type PolicyActionConnection {
  edges: [PolicyActionEdge!]!
  pageInfo: PageInfo!
}

type PolicyActionEdge {
  cursor: String!
  node: PolicyAction!
}

"Public catalog defaults; selecting a template creates no configured provider."
type ProviderTemplate {
  "Global opaque catalog identity, independent of organization resource IDs."
  id: ID!
  name: String!
  "Family hint only; configured models select their own text operation."
  protocol: ProviderApiProtocol!
  "Unknown and account-specific addresses remain null."
  baseUrl: String
}

type Query {
  organizationProfile(id: ID!): OrganizationPayload
  "Read an active user profile using verified user identity."
  userProfile(id: ID!): UserPayload
  "Return the signed-in user's personal preferences; missing rows use Core defaults without a write."
  userPreferences: UserPreferencesPayload!
  "Return the system-owned organization policy action catalog."
  organizationPolicyActions: PolicyActionConnection!
  "Return the verified current session identity."
  session: SessionPayload!
  "Return the active organization from verified user authority."
  organization: OrganizationPayload!
  members(filter: MemberFilterInput, orderBy: [MemberOrderInput!], first: Int, last: Int, before: String, after: String, offset: Int): MemberConnection!
  "Find visible role metadata in the active organization."
  role(id: ID!): RolePayload
  "Return the complete visible role metadata collection, ordered by ID."
  roles: RoleConnection!
  "Find visible group metadata in the active organization."
  group(id: ID!): GroupPayload
  "Return the complete visible group metadata collection, ordered by ID."
  groups: GroupConnection!
}

type Role {
  "Native Cedar source; template slots bind to this role and its organization."
  cedarSource: String
  id: ID!
  name: String!
  description: String!
  color: String!
  owner: Boolean!
}

type RoleConnection {
  edges: [RoleEdge!]!
  pageInfo: PageInfo!
}

type RoleEdge {
  cursor: String!
  node: Role!
}

type RolePayload {
  node: Role!
}

type Session {
  "Public avatar for this user; clients show a fallback while absent or loading."
  avatarUrl: String
  "Login session identity, serialized as a string without numeric precision loss."
  id: ID!
  "User owning this verified session."
  userId: ID!
  "Organization selected for this verified session."
  organizationId: ID!
  "Current organization name."
  organizationName: String!
}

"Timing is always returned; credential values exist only in explicit TOKEN delivery."
type SessionCredentials {
  accessLifetime: TokenLifetime!
  refreshLifetime: TokenLifetime!
  accessToken: String
  refreshToken: String
}

type SessionCredentialsPayload {
  node: SessionCredentials!
}

type SessionPayload {
  node: Session!
}

type SidebarEntry {
  item: PreferenceDestination!
  visibility: PreferenceSidebarVisibility!
}

type SidebarLayoutSection {
  category: PreferenceSidebarCategory!
  items: [PreferenceDestination!]!
}

type SidebarPreferences {
  layout: [SidebarLayoutSection!]!
  badgeStyle: PreferenceBadgeStyle!
  entries: [SidebarEntry!]!
}

type ThemePreferences {
  mode: PreferenceAppearanceMode!
  palettes: PalettePreferences!
}

"Exact Unix-second validity and client throttle values encoded as decimal strings."
type TokenLifetime {
  issuedAt: String!
  expiresAt: String!
  expiresInSeconds: String!
  throttleSeconds: String!
}

type TypographyPreferences {
  family: PreferenceFontFamily!
  size: PreferenceRelativeFontSize!
}

type UploadFormField {
  name: String!
  value: String!
}

type User {
  "Public avatar URL; the object may not exist yet and clients must show a fallback."
  avatarUrl: String
  "Stable user identity, serialized as a string."
  id: ID!
  username: String!
  "Email is readable by authenticated users and cannot be updated here."
  email: String!
  "Display name; this field does not establish identity or uniqueness."
  displayName: String!
}

type UserPayload {
  node: User!
}

type UserPreferences {
  navigation: NavigationPreferences!
  sidebar: SidebarPreferences!
  memberDisplay: MemberDisplayPreferences!
  calendar: CalendarPreferences!
  theme: ThemePreferences!
  typography: TypographyPreferences!
  accessibility: AccessibilityPreferences!
  messageComposition: MessageCompositionPreferences!
  codeAppearance: CodeAppearancePreferences!
}

type UserPreferencesPayload {
  node: UserPreferences!
}
