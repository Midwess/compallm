[package]
name = "compallm-postgres"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PostgreSQL connection, SeaORM schema and Loco migrations for Compallm"
publish = false

[lints]
workspace = true

[features]
default = []
cli = ["dep:clap", "dep:heck", "dep:pluralizer", "dep:sea-orm-cli", "dep:syn", "tokio/macros", "tokio/rt-multi-thread", "sea-orm-migration/cli"]

[[bin]]
name = "compallm-postgres"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
sha2 = { workspace = true, features = ["std"] }
compallm-query.workspace = true
thiserror = { workspace = true, features = ["std"] }
cedar-policy.workspace = true
anyhow = { workspace = true, features = ["std"] }
async-trait.workspace = true
async-once-cell.workspace = true
elsa.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
validify.workspace = true
clap = { workspace = true, optional = true, features = ["std", "derive", "env", "help", "usage", "error-context"] }
compallm-core.workspace = true
compallm-utils.workspace = true
axum.workspace = true
hero = { workspace = true, features = ["distributed-id"] }
loco-rs = { workspace = true, features = ["with-db"] }
sea-orm = { workspace = true, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid", "with-rust_decimal", "postgres-array"] }
sea-query-sqlx = { version = "0.9.1", features = ["sqlx-postgres"] }
sea-orm-migration = { workspace = true, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
sea-orm-cli = { workspace = true, optional = true, features = ["codegen", "sqlx-postgres", "runtime-tokio-rustls"] }
tokio = { workspace = true, features = ["sync"] }
heck = { workspace = true, optional = true }
pluralizer = { workspace = true, optional = true }
syn = { workspace = true, optional = true, features = ["full", "parsing"] }
