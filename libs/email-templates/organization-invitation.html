<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>You’re invited to {{ organization }} on Compallm</title>
    <style>
      :root {
        color-scheme: light;
        supported-color-schemes: light;
      }
      @media only screen and (max-width: 600px) {
        .email-padding {
          padding: 40px 24px !important;
        }
        .email-heading {
          font-size: 30px !important;
          line-height: 39px !important;
        }
        .email-description {
          font-size: 16px !important;
          line-height: 24px !important;
        }
        .email-button {
          font-size: 18px !important;
          padding: 20px 16px !important;
        }
        .email-footer {
          font-size: 13px !important;
        }
      }
    </style>
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #09090a;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        &quot;Segoe UI&quot;,
        Arial,
        sans-serif;
      -webkit-text-size-adjust: 100%;
    "
  >
    <div
      style="
        display: none;
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        mso-hide: all;
      "
    >
      {{ inviter }} invited you to join {{ organization }} on Compallm.
    </div>
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      bgcolor="#ffffff"
      style="background-color: #ffffff"
    >
      <tr>
        <td align="center" class="email-padding" style="padding: 50px 16px">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width: 630px"
          >
            <tr>
              <td align="center" style="padding: 0 0 40px">
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td
                      valign="middle"
                      aria-hidden="true"
                      style="padding-right: 10px"
                    >
                      <table
                        role="presentation"
                        width="18"
                        height="16"
                        cellpadding="0"
                        cellspacing="0"
                        border="0"
                        style="
                          width: 18px;
                          height: 16px;
                          border: 2px solid #09090a;
                        "
                      >
                        <tr>
                          <td
                            width="50%"
                            style="
                              border-right: 1px solid #09090a;
                              font-size: 0;
                            "
                          >
                            &nbsp;
                          </td>
                          <td
                            width="50%"
                            style="border-left: 1px solid #09090a; font-size: 0"
                          >
                            &nbsp;
                          </td>
                        </tr>
                      </table>
                    </td>
                    <td
                      style="
                        font-size: 22px;
                        line-height: 28px;
                        font-weight: 600;
                        color: #09090a;
                      "
                    >
                      Compallm
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 0 20px">
                <h1
                  class="email-heading"
                  style="
                    margin: 0;
                    font-size: 35px;
                    line-height: 45px;
                    font-weight: 500;
                    letter-spacing: -0.7px;
                    color: #09090a;
                    overflow-wrap: anywhere;
                    word-break: break-word;
                  "
                >
                  You’re invited to {{ organization }}
                </h1>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 0 40px">
                <p
                  class="email-description"
                  style="
                    margin: 0;
                    font-size: 18px;
                    line-height: 26px;
                    color: #626365;
                    overflow-wrap: anywhere;
                    word-break: break-word;
                  "
                >
                  {{ inviter }} invited {{ recipient }} to join<br />their
                  organization on Compallm.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding: 0 0 34px">
                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  style="max-width: 440px"
                >
                  <tr>
                    <td
                      align="center"
                      bgcolor="#5e6ad2"
                      style="
                        background-color: #5e6ad2;
                        border-radius: 999px;
                        mso-padding-alt: 24px 20px;
                      "
                    >
                      <a
                        class="email-button"
                        href="{{ invitation_url }}"
                        target="_blank"
                        rel="noopener noreferrer"
                        style="
                          display: block;
                          padding: 24px 20px;
                          border-radius: 999px;
                          font-size: 20px;
                          line-height: 24px;
                          font-weight: 600;
                          color: #ffffff;
                          text-align: center;
                          text-decoration: none;
                        "
                        >Accept invitation</a
                      >
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td align="center">
                <p
                  class="email-footer"
                  style="
                    margin: 0;
                    font-size: 14px;
                    line-height: 22px;
                    color: #626365;
                  "
                >
                  This invitation expires in 7 days. Not expecting it? Ignore
                  this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
