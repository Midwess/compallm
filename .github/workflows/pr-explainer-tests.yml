name: PR explainer tests

on:
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/pr-explainer/**
      - .github/workflows/pr-explainer*.yml
  push:
    branches: [main]
    paths:
      - .github/scripts/pr-explainer/**
      - .github/workflows/pr-explainer*.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-explainer-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .github/scripts/pr-explainer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: .github/scripts/pr-explainer/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: dependencies
        with:
          path: .github/scripts/pr-explainer/node_modules
          key: pr-explainer-deps-${{ runner.os }}-${{ runner.arch }}-node22-${{ hashFiles('.github/scripts/pr-explainer/package-lock.json') }}
      - if: steps.dependencies.outputs.cache-hit != 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
