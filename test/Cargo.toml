[package]
name = "compallm-test"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compallm cross-crate behavior tests"
publish = false

[lints]
workspace = true

[dev-dependencies]
compallm-query = { workspace = true, features = ["derive"] }
compallm-api = { path = "../api" }
axum = { workspace = true, features = ["http1", "json", "tokio"] }
tower = { workspace = true, features = ["util"] }
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std"] }
rayon.workspace = true
sec.workspace = true
router = { path = "../router" }
validify.workspace = true
anyhow = { workspace = true, features = ["std"] }
async-trait.workspace = true
coset.workspace = true
ciborium.workspace = true
hmac.workspace = true
sha2 = { workspace = true, features = ["std"] }
compallm-core.workspace = true
serde = { workspace = true, features = ["derive"] }
compallm-postgres = { workspace = true, features = ["cli"] }
compallm-utils.workspace = true
compallm-mailing.workspace = true
base64 = { workspace = true, features = ["std"] }
hero = { workspace = true, features = ["distributed-id", "token"] }
sea-orm = { workspace = true, features = ["mock"] }
sea-orm-migration.workspace = true
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "test-util"] }
tempfile = { workspace = true, features = ["getrandom"] }
cedar-policy.workspace = true
