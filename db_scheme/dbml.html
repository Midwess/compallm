  <script>
    const initial = JSON.parse(document.getElementById('initial-schema').textContent);
    let diagram = document.getElementById('diagram');
    const openDiagram = document.getElementById('open-diagram');
    const status = document.getElementById('status');
    const dialog = document.getElementById('schema-editor');
    const editor = document.getElementById('source-editor');
    const message = document.getElementById('editor-message');
    const apply = document.getElementById('apply-edit');
    const diagramRegion = document.getElementById('diagram-region');
    const loading = document.getElementById('diagram-loading');
    const loadingCaption = document.getElementById('loading-caption');
    let source = initial.dbml;
    let currentURL = initial.url;
    let applying = false;
    let loadStarted = 0;
    let completionTimer;
    let hideTimer;
    let slowTimer;

    function loadDiagram(url) {
      clearTimeout(completionTimer);
      clearTimeout(hideTimer);
      clearTimeout(slowTimer);
      loadStarted = performance.now();
      loading.hidden = false;
      loading.classList.remove('finished');
      loading.removeAttribute('aria-hidden');
      loading.setAttribute('aria-valuetext', 'Waiting for dbdiagram');
      loadingCaption.textContent = 'Loading diagram…';
      diagramRegion.setAttribute('aria-busy', 'true');
      status.textContent = 'Loading diagram';
      slowTimer = setTimeout(() => {
        loadingCaption.textContent = 'Still loading dbdiagram…';
        loading.setAttribute('aria-valuetext', 'Still waiting for dbdiagram');
      }, 10000);
      if (diagram.hasAttribute('src')) {
        diagram.removeEventListener('load', finishDiagramLoad);
        diagram.removeEventListener('error', failDiagramLoad);
        const nextDiagram = diagram.cloneNode(false);
        nextDiagram.src = url;
        nextDiagram.addEventListener('load', finishDiagramLoad);
        nextDiagram.addEventListener('error', failDiagramLoad);
        diagram.replaceWith(nextDiagram);
        diagram = nextDiagram;
        return;
      }
      diagram.src = url;
    }

    function finishDiagramLoad() {
      try {
        if (diagram.contentWindow.location.href === 'about:blank') return;
      } catch {
        // The embedded diagram has its own origin once navigation completes.
      }
      clearTimeout(slowTimer);
      clearTimeout(completionTimer);
      completionTimer = setTimeout(() => {
        diagramRegion.setAttribute('aria-busy', 'false');
        loading.setAttribute('aria-hidden', 'true');
        loading.classList.add('finished');
        status.textContent = 'Embedded schema';
        hideTimer = setTimeout(() => { loading.hidden = true; }, 180);
      }, Math.max(0, 180 - (performance.now() - loadStarted)));
    }

    function failDiagramLoad() {
      clearTimeout(slowTimer);
      clearTimeout(completionTimer);
      clearTimeout(hideTimer);
      loadingCaption.textContent = 'Unable to load. Try Open in dbdiagram above.';
      loading.setAttribute('aria-valuetext', 'Diagram could not be loaded');
      status.textContent = 'Unable to load';
    }

    function base64(bytes) {
      let binary = '';
      for (let offset = 0; offset < bytes.length; offset += 8192) {
        binary += String.fromCharCode(...bytes.subarray(offset, offset + 8192));
      }
      return btoa(binary);
    }

    async function previewURL(value) {
      const bytes = new TextEncoder().encode(value);
      if (typeof CompressionStream === 'function') {
        const stream = new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate'));
        const compressed = new Uint8Array(await new Response(stream).arrayBuffer());
        return 'https://dbdiagram.io/embed#c=' + encodeURIComponent('pako:' + base64(compressed));
      }
      return 'https://dbdiagram.io/embed#c=' + encodeURIComponent(base64(bytes));
    }

    function download(contents, mimeType, filename) {
      const url = URL.createObjectURL(new Blob([contents], {type:mimeType}));
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    }

    function closeEditor() {
      if (!applying) dialog.close();
    }

    document.getElementById('edit').addEventListener('click', () => {
      editor.value = source;
      message.textContent = 'The diagram uses dbdiagram online; your schema is embedded in this file.';
      dialog.showModal();
      editor.focus();
    });
    document.getElementById('close-editor').addEventListener('click', closeEditor);
    document.getElementById('cancel-edit').addEventListener('click', closeEditor);
    dialog.addEventListener('cancel', event => { if (applying) event.preventDefault(); });

    document.getElementById('editor-form').addEventListener('submit', async event => {
      event.preventDefault();
      if (applying) return;
      const next = editor.value;
      if (!next.trim()) {
        message.textContent = 'Enter a schema before applying.';
        return;
      }
      applying = true;
      apply.disabled = true;
      try {
        const url = next === source ? currentURL : await previewURL(next);
        source = next;
        currentURL = url;
        openDiagram.href = url;
        if (diagram.getAttribute('src') !== url) {
          loadDiagram(url);
        }
        dialog.close();
      } catch {
        message.textContent = 'Could not prepare the diagram. Your changes remain in the editor.';
      } finally {
        applying = false;
        apply.disabled = false;
      }
    });

    document.getElementById('download-dbml').addEventListener('click', () => {
      download(source, 'text/plain;charset=utf-8', 'compallm-schema.dbml');
    });

    document.getElementById('save-html').addEventListener('click', () => {
      const copy = document.documentElement.cloneNode(true);
      const snapshot = JSON.stringify({dbml:source,url:currentURL}).replace(/</g, String.fromCharCode(92) + 'u003c');
      copy.querySelector('#initial-schema').textContent = snapshot;
      copy.querySelector('#diagram').removeAttribute('src');
      copy.querySelector('#open-diagram').setAttribute('href', currentURL);
      copy.querySelector('#schema-editor').removeAttribute('open');
      copy.querySelector('#source-editor').textContent = '';
      copy.querySelector('#status').textContent = 'Opening diagram';
      copy.querySelector('#diagram-region').setAttribute('aria-busy', 'true');
      const savedLoading = copy.querySelector('#diagram-loading');
      savedLoading.removeAttribute('hidden');
      savedLoading.removeAttribute('aria-hidden');
      savedLoading.classList.remove('finished');
      savedLoading.setAttribute('aria-valuetext', 'Waiting for dbdiagram');
      copy.querySelector('#loading-caption').textContent = 'Loading diagram…';
      copy.querySelector('#apply-edit').removeAttribute('disabled');
      download('<!doctype html>' + String.fromCharCode(10) + copy.outerHTML, 'text/html;charset=utf-8', 'dbml.html');
    });

    diagram.addEventListener('load', finishDiagramLoad);
    diagram.addEventListener('error', failDiagramLoad);
    loadDiagram(initial.url);
  </script>
</body>
</html>
