[package]
name = "compallm-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared Compallm domain types and application services"
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true, features = ["std"] }
async-trait.workspace = true
base64 = { workspace = true, features = ["std"] }
chacha20poly1305 = { workspace = true, features = ["std"] }
compallm-utils.workspace = true
hero = { workspace = true, features = ["distributed-id", "token"] }
hkdf = { workspace = true, features = ["std"] }
maud.workspace = true
rand = { workspace = true, features = ["std", "thread_rng"] }
rust_decimal = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt"] }
sha2 = { workspace = true, features = ["std"] }
subtle = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
