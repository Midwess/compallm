mutation SettingsMembersInvitationCreateMany($invitationCreateManyInput: InvitationBatchCreateInput!) {
  invitationCreateMany(input: $invitationCreateManyInput) {
    edges {
      node {
        invitation {
          id
          email
          status
          expiresAt
          issuedAt
        }
        url
        emailAdmitted
      }
    }
  }
}
