settings:
  s3:
    enabled: <%= get_env(name="S3_ENABLED", default="true") %>
    region: |-
      <%= get_env(name="S3_REGION", default="us-east-1") | indent(width=6) %>
    endpoint: |-
      <%= get_env(name="S3_ENDPOINT", default="http://127.0.0.1:9000") | indent(width=6) %>
    upload_endpoint: |-
      <%= get_env(name="S3_UPLOAD_ENDPOINT", default="http://127.0.0.1:9000") | indent(width=6) %>
    access_key: |-
      <%= get_env(name="S3_ACCESS_KEY", default="admin") | indent(width=6) %>
    secret_key: |-
      <%= get_env(name="S3_SECRET_KEY", default="shhshhshh") | indent(width=6) %>
    bucket: |-
      <%= get_env(name="S3_BUCKET", default="compallm") | indent(width=6) %>
    public_base_url: |-
      <%= get_env(name="S3_PUBLIC_BASE_URL", default="http://127.0.0.1:9000/compallm") | indent(width=6) %>
    force_path_style: <%= get_env(name="S3_FORCE_PATH_STYLE", default="true") %>
    timeout_seconds: <%= get_env(name="S3_TIMEOUT_SECONDS", default="30") %>
    allowed_origins: ["*"]
  smtp:
    concurrency: <%= get_env(name="SMTP_CONCURRENCY", default="10") %>
    queue_capacity: <%= get_env(name="SMTP_QUEUE_CAPACITY", default="1024") %>
    admission_timeout_seconds: <%= get_env(name="SMTP_ADMISSION_TIMEOUT_SECONDS", default="30") %>
    send_timeout_seconds: <%= get_env(name="SMTP_SEND_TIMEOUT_SECONDS", default="60") %>
    recipient_cooldown_seconds: <%= get_env(name="SMTP_RECIPIENT_COOLDOWN_SECONDS", default="30") %>
    shutdown_timeout_seconds: <%= get_env(name="SMTP_SHUTDOWN_TIMEOUT_SECONDS", default="60") %>
    enabled: <%= get_env(name="SMTP_ENABLED", default="true") %>
    host: |-
      <%= get_env(name="SMTP_HOST", default="127.0.0.1") | indent(width=6) %>
    port: <%= get_env(name="SMTP_PORT", default="1025") %>
    from_address: |-
      <%= get_env(name="SMTP_FROM_ADDRESS", default="noreply@compallm.local") | indent(width=6) %>
    username: |-
      <%= get_env(name="SMTP_USERNAME", default="") | indent(width=6) %>
    password: |-
      <%= get_env(name="SMTP_PASSWORD", default="") | indent(width=6) %>
    tls: |-
      <%= get_env(name="SMTP_TLS", default="none") | indent(width=6) %>
  graphql:
    cookie_secure: <%= get_env(name="AUTH_COOKIE_false", default="false") %>
    public_origin: |-
      <%= get_env(name="AUTH_PUBLIC_ORIGIN", default="") | indent(width=6) %>
    max_body_bytes: 65536
    max_depth: 24
    max_fields: 512
    max_tokens: 15000
  auth:
    jwt_secret: "<%= get_env(name="AUTH_JWT_SECRET", default="local-development-signing-secret-change-before-production") %>"
    user_token_ttl_seconds: 1800
    refresh_token_ttl_seconds: 2592000

logger:
  enable: true
  pretty_backtrace: true
  level: <%= get_env(name="LOG_LEVEL", default="debug") %>
  format: compact

server:
  port: <%= get_env(name="PORT", default="3000") %>
  binding: '::'
  host: http://127.0.0.1:3000
  middlewares:
    fallback:
      enable: false

workers:
  mode: BackgroundAsync

database:
  uri: <%= get_env(name="DATABASE_URL", default="postgres://root:shh@127.0.0.1:7887/compallm") %>
  enable_logging: false
  connect_timeout: 500
  idle_timeout: 500
  min_connections: 1
  max_connections: 5
  auto_migrate: true
  dangerously_truncate: false
  dangerously_recreate: false
