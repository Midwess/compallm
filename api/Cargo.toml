[package]
name = "compallm-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Loco and Axum application with a Vite frontend"
publish = false

[lints]
workspace = true

[dependencies]
socket2 = { version = "0.6", default-features = false }
schemars.workspace = true
compallm-validation-derive.workspace = true
juniper.workspace = true
juniper_axum.workspace = true
cookie.workspace = true
validify.workspace = true
compallm-utils.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["http1", "json", "tokio"] }
axum-frontend = { workspace = true, features = ["dev"] }
compallm-postgres.workspace = true
compallm-core.workspace = true
compallm-query = { workspace = true, features = ["graphql", "derive"] }
compallm-mailing.workspace = true
compallm-storage.workspace = true
anyhow = { workspace = true, features = ["std"] }
loco-rs = { workspace = true, features = ["cli", "with-db", "cache_inmem", "worker"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "io-util", "time"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "ansi", "tracing-log"] }
