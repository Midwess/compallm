[package]
name = "compallm-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Loco and Axum API with a Vite frontend and an Orval-generated client"
publish = false

[features]
default = []
frontend-dev = ["axum-frontend/dev"]

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["http1", "json", "tokio"] }
axum-frontend.workspace = true
clap = { workspace = true, features = ["std", "derive", "color", "help", "usage", "error-context", "suggestions"] }
compallm-postgres.workspace = true
loco-rs = { workspace = true, features = ["cli", "with-db", "cache_inmem", "worker"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "signal"] }
tracing = { workspace = true, features = ["std"] }
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt", "ansi", "tracing-log"] }
utoipa = { workspace = true, features = ["macros"] }
utoipa-axum.workspace = true

[dev-dependencies]
loco-rs = { workspace = true, features = ["testing"] }
serial_test = { workspace = true, features = ["async"] }
